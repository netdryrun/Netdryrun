flips:
  - source: fixtures
    case: "tests.oracles.FP-042-UNNSESS.test_oracle_fp_042_unnsess::test_a_169_254_link_is_numbered_and_guarded"
    from: FAIL
    to: PASS
    kind: new-read
    evidence:
      - tests/oracles/FP-042-UNNSESS/test_oracle_fp_042_unnsess.py
      - tests/fixtures/unnsesschk1021_capture.txt
      - tests/fixtures/unnsesschk1021_r2_eth1_ipv4_routes_up.json
      - tests/fixtures/unnsesschk1021_r2_eth2_ipv4_routes_up.json
      - tests/fixtures/unnsesschk1041_capture.txt
      - tests/fixtures/unnsesschk1041_r2_eth1_ipv4_routes_up.json
      - tests/fixtures/unnsesschk1041_r2_eth2_ipv4_routes_up.json
    why: >-
      The test passes in both runs. It is flagged only for the new read. Its assertions (169.254.0.0/30 guarded on
      both ends, eth1 not called unnumbered) hold unchanged on 0.4.3. The candidate sends one read the base never
      sent: vtysh -c "show bgp ipv4 unicast neighbors <ethN> routes json" for each FRR BGP-unnumbered neighbour
      (leaf01 eth1 and eth2, spine01 eth1 to eth3), because 0.4.3 records those sessions (a bgp_session check and
      bgp_prefixes checks) where 0.4.2 only wrote a gap. The cited captures are live FRR 10.2.1 and 10.4.1 answers to
      exactly that command for unnumbered neighbours eth1 and eth2 (lab ndr-unnsess, filed as live-capture in
      tests/fixtures/SOURCES.yml by the oracle session; each capture log names the command). In this test's fake the
      read gets no answer, and 0.4.3 then records the stricter exact prefix count instead of a range, with a warning.
    reviewed_by: "allow-review-043c: v0.4.2's copy passes on 0.4.3 with the same assertions; the only change is the new routes read, which the captures show is FRR's real answer shape"
