flips:
  - source: gate
    case: scripts/fastfix_gate.py@a035930cfb1f
    from: FAIL
    to: PASS
    evidence: [research/captures/import-guard-v2-f84526a.txt, releases/0.4.3/gate-cmdlog-noise-probes.txt]
    why: >-
      Replaces the entry for blob 099a76ecf215 (allow-043b), stale now that 01e0a73 (fix-newread) changed the file.
      Everything up to 099a76ecf215 is as that entry said: no refusal removed against v0.4.2, and the log kept at a
      log-less base only adds flips. 01e0a73 changes one rule, in allow_entries, and it is a narrow relaxation, not a
      tightening: a kind: new-read fixture entry may now cite its own test when that test sits under tests/oracles/ or
      is unchanged since the base, which before was refused outright, so a real new read on such a test could never
      be cleared. It applies only when the same entry also cites a changed, non-code file under tests/fixtures/ that
      SOURCES.yml files as kind: live-capture (live_capture, which refuses .py, SOURCES.yml itself, unchanged files
      and bare wildcards). The reviewer-session, separation, literal-key, stale-entry and live-routing rules are
      untouched, so every entry it admits still needs a fresh reviewer and still sends each OS it touches to live.
      A verdict entry still may not cite an oracle or an unchanged file. Open hardening from the review: the gate
      checks only the SOURCES.yml label, not that the capture answers the logged command, so allowlist sessions
      check that by hand (done for the FP-042 entries in 0.4.3-unnsess-newread.yml).
    reviewed_by: "allow-review-043c, from the diff 099a76ecf215..a035930cfb1f (01e0a73 only): the one relaxed shape needs a changed live capture beside the test, every other evidence rule and the reviewer, separation and live-routing rules are unchanged; adv-newread approved 01e0a73"
  - source: gate
    case: scripts/release_gate.py@7fbeececd3ab
    from: FAIL
    to: PASS
    evidence: [research/captures/import-guard-v2-f84526a.txt]
    why: >-
      Replaces the entry for the earlier blob 645070a65e8f (import guard). The added changes: the kind bridge for
      0.4.3 against v0.4.2 only, and a copied-out judge that gets its own commit's command-log plugin. The bridge
      drops a v0.4.2 judge's keys line, and the matching unexplained flip, only for an entry whose only extra key is
      kind: new-read, and only when this commit's stricter judge matched that entry to the same new-read flip with
      no problem naming it. A bridged run is a fingerprinted MAJOR that lists each entry for review by hand, never a
      PASS. new_read_problems now keeps every changed driver on live unless the base's own fixtures kept the log
      (source fixtures); a gate-kept, missing or unknown source keeps the conservative routing. tests/fakes.py and
      scripts/fastfix_cmdlog.py join GATE_FILES.
    reviewed_by: "allow-043b, from the diff 4388bb5..HEAD: the bridge turns BLOCKER lines into a fingerprinted MAJOR only after the stricter judge's match and expires after 0.4.3; live routing is lifted only for a fixture-kept log; adv-gatelog and rev2-gatelog approved after the routing fix"
  - source: gate
    case: scripts/fastfix_cmdlog.py@f8d93ecbe443
    from: FAIL
    to: PASS
    evidence: [releases/0.4.3/gate-cmdlog-noise-probes.txt]
    why: >-
      A new gate file: the pytest plugin the judge loads into both runs, base and mixed, when the base's fixtures
      keep no command log. It only adds evidence. It begins the session record before any product import, installs
      the judge's own profiler on every test, and sorts each test's rows so the log is byte-stable. It writes a proof
      the gate requires: no proof exits 2, and an unreadable log row raises before the proof is written. It decides
      no verdict and removes no check; a command it logs can only add a new-read flip. The probes capture shows the
      scrubbing it reuses still lets a real new command through.
    reviewed_by: "allow-043b: plugin read in full; it only logs and proves it ran, and a missing proof or a bad row fails closed; adv-gatelog and rev2-gatelog approved it (sorting and the byte-stable log are tested)"
  - source: gate
    case: tests/fakes.py@9daf357ee940
    from: FAIL
    to: PASS
    evidence: [releases/0.4.3/gate-cmdlog-noise-probes.txt, research/captures/import-guard-v2-f84526a.txt]
    why: >-
      tests/fakes.py is new since v0.4.2 and is gate code from 0.4.3 on, because the gate's plugin runs it. It holds
      the shared unexpected-command refusal, the command-log profiler, the temp-path and environment scrubbing, and
      begin_session, which refuses when the product was imported before the log began. Its last edit (9db75db) only
      lets the plugin name the tree under test's src/ and tests/ roots for the profiler. Nothing in it lets a test
      pass that failed before: a fake that refuses an unknown command, and a log that finds new reads, can only add
      flips. The probes capture shows real new commands still flip after the scrubbing.
    reviewed_by: "allow-043b, from the diff 4388bb5..HEAD (roots passed through, nothing else) and the file at HEAD; the spec043 adversary rounds and recheck-cmdlog2 reviewed the profiler and scrubbing, rev2-gatelog its place in GATE_FILES"
