      no verdict and removes no check; a command it logs can only add a new-read flip. The probes capture shows the
      scrubbing it reuses still lets a real new command through.
    reviewed_by: "allow-043b: plugin read in full; it only logs and proves it ran, and a missing proof or a bad row fails closed; adv-gatelog and rev2-gatelog approved it (sorting and the byte-stable log are tested)"
