flips:
  - source: fixtures
    case: tests.test_runner_mutants::test_a_scenario_that_does_not_recover_says_later_ones_are_skipped
    from: FAIL
    to: PASS
    evidence: [tests/redteam/RT-0078-link-down-on-a-vlan-trunk-parent.yml]
    why: >-
      5f0b7d7 (FP-042-LINKDOWNSTACKED, RT-0078): before a scenario downs a link, run_scenario's _link_sessions now
      reads Lab.link_tree for the node, and an unreadable tree raises LabError (exit 2), never "nothing stacked".
      tests/test_runner_mutants.py (unchanged) imports FakeLab from the base tests/test_runner_robustness.py, which
      has no link_tree, so the scenario ends in AttributeError (status error) instead of the asserted verdict. The
      updated fake lives in test_runner_robustness.py, which this entry can't cite, so it cites the RT-0078 record
      of the new read. Re-run by ndr-allow-042-n5c in Ubuntu-ndr: the 7db9bce test file on the 5f0b7d7 src fails
      only because its fake can't answer that read, and passes, every assertion unchanged, once FakeLab.link_tree
      answers {} (no stacked devices), exactly what the updated fake adds. With nothing stacked the watched sessions
      are the base's; stacked devices only add sessions to wait for, so the code is the same or stricter for what
      the test checks.
    reviewed_by: ndr-allow-042-n5c
