name: Published surfaces agree

# Weekly, read-only: the GitHub description, PyPI, the MCP Registry, LobeHub and netdryrun.com/llms.txt name the
# version and platforms the source says (scripts/surfaces_agree.py published; 0.4.2 priority 4, after 0.4.1 shipped
# NX-OS and RouterOS while three official places disagreed). Red opens an issue, or comments on the open one, with
# the exact surface and text. The release gate's after-publish layer runs the same check on every release.
on:
  schedule:
    - cron: "0 1 * * 1"   # Mondays 01:00 UTC (08:00 Thailand)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: surfaces-weekly
  cancel-in-progress: false

jobs:
  surfaces:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write   # open or comment on the "surfaces disagree" issue
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Install (hash-locked dependencies)
        run: python -m pip install --quiet --require-hashes -r requirements/ci.txt
      - name: Published surfaces
        id: check
        run: |
          set +e
          python scripts/surfaces_agree.py published > "$RUNNER_TEMP/surfaces.txt" 2>&1
          code=$?
          cat "$RUNNER_TEMP/surfaces.txt"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"
      - name: Open or update the issue
        if: failure() && steps.check.outputs.code != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Published surfaces disagree (weekly check)"
          {
            echo "The weekly check found published surfaces that don't match the source ([run]($RUN_URL))."
            echo
            echo '```text'
            cat "$RUNNER_TEMP/surfaces.txt"
            echo '```'
            echo
            echo "Fix the source of each line, then run the workflow again. Exit 2 means a surface couldn't be read."
          } > "$RUNNER_TEMP/body.md"
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" \
                   --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/body.md"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$RUNNER_TEMP/body.md"
          fi
