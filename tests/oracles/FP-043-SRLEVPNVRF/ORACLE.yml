id: FP-043-SRLEVPNVRF
bug: >-
  On SR Linux, `bgp_route vrf ipvrf prefix 10.99.0.0/24 present: false` passes while an EVPN IP-prefix (type-5) route
  for it is imported into ip-vrf ipvrf and installed there (route-type bgp-evpn): with no `protocols bgp` in the ip-vrf
  the driver reads ipvrf's empty bgp-rib ("no BGP path"; the route is in the default network-instance's EVPN RIB with
  imported-network-instances [ipvrf]); with a PE-CE BGP session in the ip-vrf, ipvrf's bgp-rib lists the route as
  origin-protocol bgp-evpn from 0.0.0.0 and the driver takes it for the router's own route ("a prefix this node
  originates itself isn't checked"), which `netdryrun check` passed live (red team RT-0058, GHSA-ggcf-664f-c9ff case
  2; captured live on SR Linux 26.7.2, lab srl-evpn-oracle, 2026-11-21)
