id: FP-043-FRRIMPORTCHK
bug: >-
  On FRR (10.4.1; same bgpd code in 8.5.4, 10.2.1 and master) a `network` statement with no route behind it stays
  announced for the life of the lab when bgpd applied it before its zebra connection was up: the import check answers
  valid with no zebra connection and its registration is never sent again, so bgpd shows the import-check entry
  invalid and "Is not Registered" next to a valid, sourced, best path. netdryrun reads only the routes and passes
  `route <neighbor> <prefix> present: true` (run/check) and approves the change in verify, while production (import
  check registered) withdraws the prefix. Corpus v2 case 18 (research/case18-race); every release with the FRR driver
