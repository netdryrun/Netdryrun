id: FP-042-UNNSESS
bug: >-
  `record` on an FRR BGP-unnumbered fabric (FRR 10.2.1, martimy/clab-bgp-frr) records no bgp_session or bgp_prefixes
  check for the interface-named neighbors yet exits 0 with no INCOMPLETE BASELINE line (red team RT-0066); and the
  link-subnet step reads an iproute2 point-to-point address (`inet A peer B/31`) as A/32, and calls a numbered
  169.254.0.0/30 link with a BGP session over it unnumbered, so neither gets the right guard and record exits 0
