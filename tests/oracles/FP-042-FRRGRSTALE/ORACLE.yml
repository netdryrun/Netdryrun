id: FP-042-FRRGRSTALE
bug: >-
  During a BGP graceful restart, FRR keeps the restarting peer's paths marked stale until End-of-RIB, and
  acceptedPrefixCounter counts them. The 0.4.2 FRR driver reads that counter and `bgp_prefixes min` runs as a positive
  check before any End-of-RIB gate, so `bgp_prefixes node r1 neighbor 10.0.13.2 min: 4` passed ("4 ipv4-unicast
  prefixes accepted") while the restarted peer sent only 3 and End-of-RIB was pending (captured live on FRR 10.4.1,
  lab ndr-rpgr, 2026-11-13, repro-042c F-GR). Stale paths settle no count: min 4 and min 3 must not pass in the
  window. The control (min 3 passes after End-of-RIB) is a guard in tests/test_oracle_guards_fp_042_frrgrstale.py,
  since the oracle folder holds red tests only
