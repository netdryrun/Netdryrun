id: FP-042-SRLADDPATH
bug: >-
  With BGP add-path receive on SR Linux, the neighbor's received-routes counts paths, and the SR Linux driver reads
  received-routes minus the AS-loop paths as the prefix count, so `bgp_prefixes node srl1 neighbor 10.0.100.2 min: 4`
  passes with only 2 prefixes accepted (4 valid paths) (red team RT-0068, captured live on SR Linux 26.7.2, lab
  ndr-rpsrl, 2026-11-13)
