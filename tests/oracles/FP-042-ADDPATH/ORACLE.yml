id: FP-042-ADDPATH
bug: >-
  With BGP add-path (the neighbor sends several paths per prefix), FRR's `show bgp neighbors json`
  acceptedPrefixCounter counts paths, and the FRR driver reads it as the prefix count, so `bgp_prefixes node r1
  neighbor 10.0.12.2 min: 4` passes with only 2 prefixes accepted (4 paths) (red team RT-0066, captured live on FRR
  10.4.1, lab ndr-repro042, 2026-11-12)
