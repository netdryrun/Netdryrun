id: RT-S01
bug: >-
  `netdryrun record --attributes` on SR Linux records the best path of a route its iBGP peer originates without
  `as_path` and without a warning: SR Linux prints that path's attr-set with no `as-path` container, the driver reads
  it as unknown (None) and `record._attribute_check` drops the key, so the baseline passes once the path becomes
  64666 (GHSA-ggcf-664f-c9ff case 4; live capture 2026-11-10, SR Linux 26.7.2 and FRR 10.4.1 in AS 65010)
