id: FP-042-EOSADDPATH
bug: >-
  With BGP additional-paths receive on cEOS, `show ip bgp summary | json` prefixAccepted counts paths, and the EOS
  driver reads it as the prefix count, so `bgp_prefixes node ceos1 neighbor 10.0.200.2 min: 4` passes with only 2
  prefixes accepted (4 paths) (red team RT-0069, captured live on cEOS 4.36.3M, lab ndr-rpeos, 2026-11-13)
