id: FP-043-EOSAGG
bug: >-
  Arista EOS names the node's own BGP aggregate (`aggregate-address`) by whether it won route selection, never `bgp`
  as FRR does on the same scenario: selected, it is protocol aggregate (routeType bgpAggregate), so `route <agg>
  protocol: bgp, present: false` passes (RT-0085); behind a static for the same prefix it is nothing on 0.4.2 (`bgp`
  and `aggregate` with `present: false` both pass) and a not-selected bgp candidate on ndr/fix-eos-nonbgp (`aggregate,
  present: false` passes, RT-0086). IPv4, IPv6 and VRF alike, live on cEOS 4.36.3M and FRR 10.4.1 (lab ndr-eosagg,
  2026-11-21; red team RT-0087). The guards (healthy phases, a learned exact path still bgp, a selected aggregate still
  fails present: false, FRR's yardstick verdicts) are in tests/test_oracle_guards_fp_043_eosagg.py
