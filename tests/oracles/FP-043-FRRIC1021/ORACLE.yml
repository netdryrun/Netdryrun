id: FP-043-FRRIC1021
bug: >-
  On FRR 10.2.1 the FRR import check refuses the interface next-hop line of `show bgp import-check-table detail`
  (10.2.1 prints `  if lo`, 10.4.1 `  if lo, ifindex 1`; the parser knows only the 10.4.1 form), so a lab whose
  `network` statements resolve over an interface (a loopback, an unnumbered link) ends `record`, `run` and `check` in
  a lab error (exit 2, "a line this check doesn't know: '  if lo'") with no verdict; first met by an outside public
  lab on FRR 10.2.1 ("'  if eth3'"), reproduced live on the committed unnumbered lab
