id: FP-043-EOSNONBGP
bug: >-
  Arista EOS (0.2.0 to 0.4.2): `route ... present: false` with a protocol other than bgp passes while a route of that
  protocol is in the RIB but not selected (GHSA-ggcf-664f-c9ff case 1, red team RT-0056 and RT-0063). `show ip route
  <prefix> | json` lists only the selected route, and the driver reads not-selected candidates from the BGP table only;
  `show rib route ip vrf <vrf> <prefix> | json` lists every candidate per protocol with `bestRoute`. Captured live on
  cEOS 4.36.3M with FRR 10.4.1 (lab ndr-fp043, 2026-11-21): a floating static default (250) behind an eBGP default
  (200) passed `protocol: static, present: false`, and an OSPF external default (110) behind `ip route 0.0.0.0/0 Null0`
  passed `protocol: ospf, present: false` (netdryrun 0.4.2 reports in the evidence). The EOS driver must see every
  candidate for the prefix, so both checks fail. Nothing is derived: every answer is a capture. Guards (healthy
  phases still pass, the selected route still fails present: false, a losing candidate never passes present: true,
  EOS's longest-match answer for 9.9.9.0/24 is not that prefix) are in tests/test_oracle_guards_fp_043_eosnonbgp.py
