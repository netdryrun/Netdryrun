id: FP-043-UNNSESSCHK
bug: >-
  An FRR BGP-unnumbered session (`neighbor eth1 interface`, keyed `eth1` by bgpd) gets no check: netdryrun.yml refuses
  `neighbor: eth1`, `record` writes only an INCOMPLETE BASELINE line for it (exit 1), so nothing guards the session
  going down or a new prefix over it; and a driver that keys sessions by address doesn't refuse such a check before
  deploying
