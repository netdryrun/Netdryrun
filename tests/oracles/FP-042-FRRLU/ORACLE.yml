id: FP-042-FRRLU
bug: >-
  A BGP session activated only for `address-family ipv4 labeled-unicast` carries IPv4 routes into the unicast RIB, but
  FRR's `show bgp neighbors json` lists only `ipv4LabeledUnicast` (acceptedPrefixCounter 0) for it, so the 0.4.2 FRR
  parser (SONiC shares it) reports the session as not carrying ipv4-unicast and `bgp_prefixes node r1 neighbor
  10.0.12.2 afi ipv4-unicast exact: 0` passed ("0 ipv4-unicast prefixes (the session doesn't carry ipv4-unicast)")
  while r1 had r2's 3 prefixes installed as BGP routes via 10.0.12.2 (captured live on FRR 10.4.1, lab ndr-rplu,
  2026-11-15, repro-042d RT-0080, with nodes.r1.peers.10.0.12.2.eor: not_sent; without it the End-of-RIB gate failed
  it closed). `exact: 0` on ipv4-unicast must not pass on the capture, with or without the gate, and `record` must not
  write it for that session. Guards (an IPv6-only session still passes exact 0 on ipv4-unicast, max 0 still fails
  here) are in tests/test_oracle_guards_fp_042_frrlu.py, since the oracle folder holds red tests only
