id: FP-043-VRFDEV
bug: >-
  On FRR (and SONiC) a `ping` check in a VRF passes to an address on the VRF device itself: the driver reads the
  node's own addresses in the VRF with `ip -j addr show vrf <vrf>`, which lists only the interfaces enslaved to it,
  never the VRF device, so the own-address refusal never sees 10.9.9.9 on `red` and the kernel answers the ping
  locally (0.4.1 advisory GHSA-ggcf-664f-c9ff case 3, red team RT-0053; captured in the pinned FRR 10.4.1 image)
evidence:
  - tests/fixtures/frr1041_vrfdev_capture.txt
  - tests/fixtures/frr1041_vrfdev_capture.sh
  - tests/fixtures/SOURCES.yml
  - tests/test_oracle_guards_fp_043_vrfdev.py
