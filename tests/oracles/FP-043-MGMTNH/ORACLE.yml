id: FP-043-MGMTNH
bug: >-
  On a Linux-kind node (FRR 10.4.1), a routing-protocol route whose next hop resolves only over Docker's management
  default (`198.51.100.0/24 nhid 7 via 172.20.20.1 dev eth0 proto bgp`) makes `mgmt.prepare` end the run before it
  deletes that default, although once the default is deleted the route re-resolves inside the lab (live: within 0.07 s,
  over up1's BGP default). Corpus v1 case 19 (next-hop-self removed on pe2 toward pe1, expected unsafe) ends in a run
  error for all three strategies on 6281dba, and the release gate stops on it. A false fail (run error), not a false
  pass; every release since the management-path removal (0.4.1) whenever such a route exists
