reproduce: >-
  containerlab: SR Linux srl1 eBGP to FRR (examples/srl-frr) receiving 0.0.0.0/0, plus `network-instance default
  static-routes route 0.0.0.0/0 preference 250 next-hop-group nhg-backup`. route-table shows the bgp route only;
  the static appears there only after the BGP session is shut. Check {type: route, node: srl1, prefix: 0.0.0.0/0,
  protocol: static, present: false} passes; on FRR it fails.
