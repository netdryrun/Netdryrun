            "leakable": false,
            "leaked": false,
            "metric": 0,
            "preference": 170,
            "active": true,
            "route-limit-exceeded": false,
            "last-app-update": "2026-11-09T08:27:42.049Z (a second ago)",
            "next-hop-group": "44970325",
            "next-hop-group-network-instance": "default",
            "resilient-hash": false,
            "dynamic-load-balancing": false,
