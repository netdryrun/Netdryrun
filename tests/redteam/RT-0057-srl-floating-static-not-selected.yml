id: RT-0057
title: >-
  route 0.0.0.0/0 protocol static present: false passes on SR Linux while a static default with preference 250 is
  configured and valid but loses to the BGP default: the network-instance route table lists only the active route
  (tests/fixtures/srl_leak_route.txt lists the static alone while a BGP path lost to it), and the driver looks for
  not-selected routes in the BGP RIB only, so a non-BGP route that is present but not selected is never seen (FRR's
  zebra lists every entry for the prefix, and the same check fails there)
found: 2026-11-09, red team A (drivers)
fixed_in: null
retired: "refuted live, 2026-11-09: SR Linux 26.7.2 lists the losing static default with active false and the check fails (wt/rg-srl-losers)"
kind: driver
driver: srlinux
check:
  type: route
  node: srl1
  prefix: 0.0.0.0/0
  protocol: static
  present: false
outputs:
  - needle: "route-table ipv4-unicast route 0.0.0.0/0"
    output: |
      {
        "route": [
          {
            "ipv4-prefix": "0.0.0.0/0",
            "id": 0,
            "route-type": "bgp",
            "route-owner": "bgp_mgr",
