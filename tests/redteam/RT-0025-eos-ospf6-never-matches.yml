id: RT-0025
title: "route protocol ospf6 present: false passes on EOS with an OSPFv3 route installed: the EOS protocol map has no entry that yields ospf6, so the accepted name never matches an EOS route"
found: "2026-11-01, weekly adversarial run"
fixed_in: 0.4.1
kind: driver
# outputs: hand-written by the red team to the structure of cEOS 4.36.3M's `show ipv6 route | json`; routeType and routeSubtype are the ones a live capture prints for this route (tests/fixtures/eos_ipv6_route_ospf3_ext.txt)
driver: eos
check:
  type: route
  node: r1
  prefix: 2001:db8:77::/48
  protocol: ospf6
  present: false
outputs:
