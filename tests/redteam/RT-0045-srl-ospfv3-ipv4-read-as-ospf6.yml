id: RT-0045
title: 'route protocol ospf present: false passes on SR Linux with an OSPFv3 IPv4 route (ospf version 3, address-family ipv4-unicast)
  installed: route-type ospfv3 is mapped to ospf6 for every family, and validate refuses ospf6 for an IPv4 prefix'
