meant: r1 has no OSPF-learned route for 10.99.0.0/24.
why_false: 'An OSPFv3 route for the IPv4 prefix is active and in the FIB. The driver maps route-type ospfv3 to ospf6 for every
  family; validate refuses ospf6 for an IPv4 prefix, and `protocol: ospf` matches only ospfv2, so the guard can never see
  an OSPFv3-learned IPv4 route.'
why_nos_prints: SR Linux runs OSPFv3 with `address-family ipv4-unicast` (RFC 5838) and its route-table prints route-type ospfv3
  for the routes it installs (same route-type vocabulary as srl_route.txt, which prints bgp/static plainly). Output built
  on srl_route.txt with route-type ospfv3, route-owner ospf_mgr.
reproduce: 'Two SR Linux nodes (kind nokia_srlinux), network-instance default, `protocols ospf instance o3 version ospf-v3
  address-family ipv4-unicast`, area 0 on the link; the peer advertises 10.99.0.0/24 (loopback). Check `route r1 10.99.0.0/24
  protocol: ospf present: false` passes.'
