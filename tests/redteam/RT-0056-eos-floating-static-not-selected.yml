id: RT-0056
title: >-
  route 0.0.0.0/0 protocol static present: false passes on Arista EOS while a floating static default
  (`ip route 0.0.0.0/0 10.0.9.1 250`) is configured and valid but loses to the eBGP default: `show ip route <prefix>`
  lists only the route EOS selected (one entry per prefix, tests/fixtures/eos_leak_route.txt), and the driver reads a
  not-selected route only from the BGP table, so a non-BGP route that is present but not selected is never seen (FRR
  lists it: zebra prints every entry for the prefix, and the same check fails there)
found: 2026-11-09, red team A (drivers)
fixed_in: null
accepted_limit:
  decided: 'owner, 2026-11-09: ship 0.4.1 and publish the four as known limits (no source change after the final gate runs);
    fix in 0.4.2'
  mitigation: check the route where it comes from, and add a positive route check that the selected route has the expected
    protocol
  fix_in: '0.4.3: read every candidate route on EOS'
  detail: absent
  published:
    website/docs/reference/config.md:
    - accepted for 0.4.1; RT-0056, RT-0063
    - lists only the route it selected
    website/docs/trust.md:
    - (RT-0056, RT-0063)
    CHANGELOG.md:
    - '**Arista EOS** (RT-0056, RT-0063)'
    advisories/0.4.1-known-false-passes/README.md:
    - RT-0063)
    - reads every candidate route
kind: driver
driver: eos
check:
  type: route
  node: r3
  prefix: 0.0.0.0/0
  protocol: static
  present: false
outputs:
  # the selected route only: the eBGP default (shape of tests/fixtures/eos_route_longest_match.txt, cEOS live)
  - needle: "show ip route vrf default 0.0.0.0/0"
    output: |
      {
          "vrfs": {
              "default": {
                  "routingDisabled": false,
                  "allRoutesProgrammedHardware": true,
                  "allRoutesProgrammedKernel": true,
                  "defaultRouteState": "reachable",
                  "routes": {
                      "0.0.0.0/0": {
                          "hardwareProgrammed": true,
                          "routeType": "eBGP",
                          "routeLeaked": false,
                          "kernelProgrammed": true,
                          "preference": 200,
                          "metric": 0,
                          "routeAction": "forward",
                          "directlyConnected": false,
                          "vias": [
                              {
                                  "nexthopAddr": "10.0.200.2",
                                  "interface": "Ethernet1"
                              }
                          ]
                      }
                  }
              }
          }
      }
  # the eBGP default, best and installed (live capture)
  - needle: "show ip bgp 0.0.0.0/0"
    fixture: eos_leak_bgp.txt
reproduce: >-
  containerlab: cEOS r3 (4.36.x) eBGP to FRR r2, which originates 0.0.0.0/0. r3 config: `ip route 0.0.0.0/0
  10.0.9.1 250` (the old static default, meant to be removed by the change but left as a floating backup). `show ip
  route 0.0.0.0/0 | json` lists the eBGP route only; `show ip route 0.0.0.0/0 detail` / `show ip route static
  not-installed` shows the static. Check {type: route, node: r3, prefix: 0.0.0.0/0, protocol: static, present:
  false} passes; shut the eBGP session and the static is installed. The same check on an FRR node fails (zebra lists
  the unselected static entry).
