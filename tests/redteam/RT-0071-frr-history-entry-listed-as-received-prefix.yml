id: RT-0071
title: >-
  record on FRR wrote a prefix the neighbor had withdrawn into a bgp_prefixes `only` list, so the prefix coming back
  passed the recorded check: with `bgp dampening`, bgpd keeps the withdrawn prefix in `neighbors N routes json` as a
  history path, and parse_received (bgp_received, `only:` and record's closed world) listed it as a prefix the
  neighbor sends; an `only:` check stayed not-ready ("counted ... but ... listed") while the entry lasted. SONiC
  shares the driver.
found: "2026-11-13, adversary review of the RT-0070 fix on the 0.4.2 candidate (a cousin of RT-0070)"
fixed_in: 0.4.2
kind: pinned
# The reproduction is the oracle FP-042-FRRRECVHIST (bgp_received, a record run and the recorded check on a listing
# derived from the live FRR 10.4.1 captures of RT-0070 and RT-0066), with the unit tests of the fix for SONiC.
tests:
