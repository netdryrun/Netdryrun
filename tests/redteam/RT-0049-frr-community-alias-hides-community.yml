meant: The best path for 192.168.22.0/24 on r1 must not carry community 65020:777.
why_false: 'The path carries 65020:777. With `bgp community alias 65020:777 65020:100` bgpd prints the alias in its place;
  the alias has the shape of a community, so canon_communities keeps it as 65020:100, it is not ''unreadable'', and without_communities
  passes. The same trick passes `communities: [''65020:100'']` on a path that doesn''t carry 65020:100.'
why_nos_prints: frr_bgp_paths_comm_alias.txt (FRR 10.4.1 live) shows bgpd printing an alias in community.string and community.list
  in place of the value; bgpd checks that the community side of `bgp community alias` is a community, not that the alias isn't
  one.
reproduce: 'Lab ndr-fpcap shape: r2 tags 192.168.22.0/24 with 65020:777; on r1 `bgp community alias 65020:777 65020:100`;
  `show bgp ipv4 unicast 192.168.22.0/24 json` prints 65020:100; the without_communities check passes. (Plausibility: needs
  an alias that looks like a number; low, but it defeats the documented alias guard.)'
