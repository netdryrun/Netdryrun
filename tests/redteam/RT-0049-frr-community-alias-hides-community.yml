id: RT-0049
title: 'bgp_route without_communities [''65020:777''] passes on FRR while the best path carries 65020:777: with `bgp community
  alias 65020:777 65020:100` bgpd prints the alias in place of the value, and an alias shaped like a community is read as
  that community (the unreadable-name guard only catches aliases that don''t look like numbers)'
found: "2026-11-08, red-team agent d87/A (offline, crafted output); angle-5 red team on d87aa3e, verified by a fresh verifier; live confirmation pending"
fixed_in: null
kind: driver
driver: frr
check:
  type: bgp_route
  node: r1
  prefix: 192.168.22.0/24
  without_communities:
  - 65020:777
outputs:
