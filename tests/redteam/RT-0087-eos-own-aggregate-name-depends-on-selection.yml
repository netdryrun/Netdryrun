id: RT-0087
title: >-
  Arista EOS: the node's own BGP aggregate (`aggregate-address`) is named by whether it won route selection, never as
  FRR names it: selected, it is protocol aggregate, so `route <agg> protocol: bgp, present: false` passes (RT-0085);
  behind a static for the same prefix it is nothing on 0.4.2 (`protocol: bgp` and `protocol: aggregate` with
  `present: false` both pass) and a not-selected bgp candidate on ndr/fix-eos-nonbgp (`protocol: aggregate, present:
  false` passes, RT-0086). FRR names its own aggregate bgp in both states and refuses protocol aggregate. IPv4, IPv6
  and a VRF alike
found: >-
  2026-11-21, oracle session oracle-eos-agg (FP-043-EOSAGG), live on cEOS 4.36.3M and FRR 10.4.1 on the same scenario
  (lab ndr-eosagg); shapes first raised by red team 042-GV (A-RT-0077) and the adversary re-check of
  ndr/fix-eos-nonbgp 49dc098
fixed_in: null
# OPEN: no fix yet (oracle FP-043-EOSAGG is red on main and on ndr/fix-eos-nonbgp). The fix names the aggregate bgp in
# every read (routeType bgpAggregate; the RIB's B entry and the BGP table's localAgg path behind a static) and turns
# RT-0085 and RT-0086 from accepted limits into fixed cases. Workaround for released versions: bgp_route with
# present: false on the prefix fails in both shapes (the BGP table lists the own aggregate). Expected behaviour and
# the live EOS/FRR verdict table: tests/oracles/FP-043-EOSAGG/README.md.
