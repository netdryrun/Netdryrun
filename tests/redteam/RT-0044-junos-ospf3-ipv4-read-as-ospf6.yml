meant: r1 has no OSPF-learned route for 10.99.0.0/24 (the IPv4 prefix must not leak into OSPF).
why_false: 'An OSPF route for the prefix is installed and forwarding (active-tag *, KRT in-kernel). It was learned by OSPFv3
  running the ipv4-unicast realm (RFC 5838); the driver names it ospf6, validate refuses `protocol: ospf6` for an IPv4 prefix
  (config.py: ''OSPFv3 ... IPv6 only''), so no protocol name the user may write can ever match it and present: false holds.'
why_nos_prints: 'Junos prints protocol-name OSPF3 for every route ospf3 installs, inet.0 routes of `protocols ospf3 realm
  ipv4-unicast` included (show route: [OSPF3/10]). Output built on junos_route_static.txt (cjunosevolved 26.2R1.7-EVO, same
  extensive JSON shape) with protocol-name OSPF3; JunosDriver PROTOCOLS maps ospf3 -> ospf6 without looking at the family.'
reproduce: 'examples/junos-frr: on the Junos node `set protocols ospf3 realm ipv4-unicast area 0 interface et-0/0/0.0`, peer
  a FRR/second Junos node running OSPFv3 IPv4 AF (or a second cJunos) that originates 10.99.0.0/24; check `route r1 10.99.0.0/24
  protocol: ospf present: false` passes while `show route 10.99.0.0/24` shows [OSPF3/10].'
