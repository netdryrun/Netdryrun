id: RT-0044
title: 'route protocol ospf present: false passes on Junos with an OSPFv3 (realm ipv4-unicast) IPv4 route installed: the driver
  maps protocol-name OSPF3 to ospf6 whatever the family, and validate refuses ospf6 for an IPv4 prefix, so no protocol name
  can match an OSPFv3-learned IPv4 route'
found: "2026-11-08, red-team agent d87/A (offline, crafted output); angle-5 red team on d87aa3e, verified by a fresh verifier; live confirmation pending"
