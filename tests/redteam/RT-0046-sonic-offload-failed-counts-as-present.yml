- needle: show bgp
  fixture: sonic_bgp_paths.txt
meant: sonic1 forwards 192.168.20.0/24 over the BGP route.
why_false: 'zebra says the hardware programming failed (offloadFailed: true): the route is not in the ASIC, so the switch
  does not forward it. The FRR parser treats selected + installed (+ not failed) as forwarding; on SONiC installed only means
  handed to fpmsyncd.'
why_nos_prints: 'FRR zebra prints offloaded / offloadFailed / trapped from the dataplane''s offload feedback (zebra_vty.c
  route JSON). The SONiC fixture sonic_route.txt (live SONiC VS) prints offloaded: true on a programmed route, so this SONiC
  build feeds ASIC results back to zebra; a failed orchagent programming flips it to offloadFailed while installed stays true.'
reproduce: 'examples/sonic-frr: make orchagent fail the route (e.g. exhaust the VS CRM ipv4 route resource with `crm config
  thresholds`/a large static batch, or point the route at a next hop whose neighbor orchagent can''t resolve) and read `vtysh
  -c ''show ip route 192.168.20.0/24 json''`: offloadFailed true, installed true; `route sonic1 192.168.20.0/24 protocol:
  bgp` passes.'
