id: RT-0046
title: 'route present passes on SONiC for a route the ASIC failed to program: fpmsyncd/orchagent report the failure back and
  zebra prints offloadFailed: true (installed stays true: the FPM hand-off worked); the FRR parser reads selected, installed
  and failed only'
found: "2026-11-08, red-team agent d87/A (offline, crafted output); angle-5 red team on d87aa3e, verified by a fresh verifier; live confirmation pending"
fixed_in: null
kind: driver
driver: sonic
check:
  type: route
  node: sonic1
  prefix: 192.168.20.0/24
  protocol: bgp
outputs:
- needle: show ip route
  output: |
