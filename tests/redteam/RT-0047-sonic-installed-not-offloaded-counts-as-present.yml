meant: sonic1 forwards 192.168.20.0/24 over the BGP route.
why_false: 'The route was handed to fpmsyncd (installed) but the ASIC never confirmed it (no offloaded flag, while every programmed
  route on this build prints offloaded: true). With orchagent stopped or stuck the route is in zebra and the kernel, not in
  the switch''s forwarding plane, and the check passes on two samples.'
why_nos_prints: 'Same JSON as sonic_route.txt (live SONiC VS) without the offloaded key: zebra leaves it out until the dataplane
  acknowledges the route (ZEBRA_FLAG_OFFLOADED).'
reproduce: 'examples/sonic-frr: `docker exec sonic1 supervisorctl stop orchagent` (swss container), then let the peer advertise
  192.168.20.0/24 (or clear the session); `show ip route 192.168.20.0/24 json` shows installed true, no offloaded; the route
  check passes while traffic through the switch is dropped.'
