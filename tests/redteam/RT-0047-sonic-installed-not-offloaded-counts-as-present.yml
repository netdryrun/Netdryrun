id: RT-0047
title: 'route present passes on SONiC for a route zebra handed to fpmsyncd but the ASIC never confirmed: with route offload
  feedback on (sonic_route.txt prints offloaded: true for a programmed route) a route without offloaded is not in the ASIC
  yet (orchagent stopped or stuck), and the driver reads installed alone'
found: "2026-11-08, red-team agent d87/A (offline, crafted output); angle-5 red team on d87aa3e, verified by a fresh verifier; not reproduced live: docker-sonic-vs master.1258173 printed offloaded true even for a static added with orchagent stopped (wt/a5-live/b, 2026-11-08); kept as a fail-closed guard"
fixed_in: null
