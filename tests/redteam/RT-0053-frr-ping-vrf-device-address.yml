id: RT-0053
title: >-
  ping in vrf red passes on FRR when the target is the node's own VRF loopback, an address on the VRF device itself
  (ip addr add 10.9.9.9/32 dev red): `ip -j addr show vrf red` lists only the interfaces enslaved to red, never the
  VRF master device, so the own-address refusal never sees it and the kernel answers the ping locally
found: 2026-11-09, red team A (drivers)
fixed_in: null
accepted_limit:
  decided: 'owner, 2026-11-09: ship 0.4.1 and publish the four as known limits (no source change after the final gate runs);
    fix in 0.4.2'
  mitigation: put a VRF loopback on an interface enslaved to the VRF, or ping the address from another node
  fix_in: '0.4.2: the VRF device''s own addresses count as the node''s'
  detail: replies
  published:
    website/docs/reference/config.md:
    - accepted for 0.4.1; RT-0053
    - doesn't list the VRF device itself
    website/docs/trust.md:
    - (RT-0053)
    - Put VRF loopbacks on an enslaved interface
    CHANGELOG.md:
    - '**FRR and SONiC** (RT-0053)'
    advisories/0.4.1-known-false-passes/README.md:
    - (RT-0053)
    - the VRF device's own addresses count as the node's
kind: driver
driver: frr
check:
  type: ping
  node: r1
  vrf: red
  target: 10.9.9.9
outputs:
  # iproute2 `ip -j addr show vrf red`: devices whose master is red (eth2); the VRF device red (10.9.9.9/32) has no
  # master and is not listed (same JSON shape as tests/fixtures/frr_local_ip_addr.json)
  - needle: "ip -j addr"
    output: |
      [{"ifindex":9,"link_index":8,"ifname":"eth2","flags":["BROADCAST","MULTICAST","UP","LOWER_UP"],"mtu":9500,"qdisc":"noqueue","master":"red","operstate":"UP","group":"default","link_type":"ether","address":"aa:c1:ab:ea:a8:c4","broadcast":"ff:ff:ff:ff:ff:ff","link_netnsid":1,"addr_info":[{"family":"inet","local":"10.0.23.1","prefixlen":30,"broadcast":"10.0.23.3","scope":"global","label":"eth2","valid_life_time":4294967295,"preferred_life_time":4294967295},{"family":"inet6","local":"fe80::a8c1:abff:feea:a8c4","prefixlen":64,"scope":"link","protocol":"kernel_ll","valid_life_time":4294967295,"preferred_life_time":4294967295}]}]
  # busybox ping inside the VRF (shape of tests/fixtures/frr_ping.txt): the kernel answers from the VRF device
  - needle: "ping -c"
    output: |
      PING 10.9.9.9 (10.9.9.9): 56 data bytes
      64 bytes from 10.9.9.9: seq=0 ttl=64 time=0.041 ms
      64 bytes from 10.9.9.9: seq=1 ttl=64 time=0.077 ms
      64 bytes from 10.9.9.9: seq=2 ttl=64 time=0.069 ms

      --- 10.9.9.9 ping statistics ---
      3 packets transmitted, 3 packets received, 0% packet loss
      round-trip min/avg/max = 0.041/0.062/0.077 ms
reproduce: >-
  containerlab: two FRR nodes r1, r2 (quay.io/frrouting/frr:10.4.1). exec on r1: `ip link add red type vrf table 10`,
  `ip link set red up`, `ip link set eth2 master red`, `ip addr add 10.0.23.1/30 dev eth2`, `ip addr add
  10.9.9.9/32 dev red` (the VRF's loopback, the usual Linux idiom). Check: {type: ping, node: r1, vrf: red, target:
  10.9.9.9}. `ip -j addr show vrf red` lists eth2 only; `ip vrf exec red ping 10.9.9.9` answers 3/3 from r1 itself.
  Same code path on SONiC.
