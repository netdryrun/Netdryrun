# Every false pass Netdryrun is known to have had, and the tests that prove it still can't happen.
#
# The contributor CI (scripts/contrib_gate.py known-false-passes) runs these tests as the BASE branch has them, against
# the pull request's code: a pull request can't make a known false pass come back by editing the test that guards it.
# tests/test_known_false_passes.py fails when an advisory, a row of the advisories table on the trust page, or a
# corpus loss that was fixed has no entry here.
#
#   id         stable name
#   what       the false pass, in one line
#   record     where it is published
#   trust      the "Version" cell of its row in website/docs/trust.md's advisories table, if it has one
#   corpus     corpus cases it covers (corpus/<v>/cases/<id>.yml): the label-gated live job reruns the corpus and
#              any changed netdryrun verdict fails (scripts/contrib_gate.py corpus-results)
#   tests      pytest files or node ids, run offline on every pull request

- id: advisory-0.3.0-false-pass
  what: A check could pass without testing what the file said (misspelled key, quoted boolean, unknown afi or
    protocol, duplicate key, min 0, vrf all)
  record: advisories/0.3.0-false-pass/README.md
  trust: "0.3.0"
  tests:
    - tests/test_advisory_fixtures.py
    - tests/test_redteam.py
    - tests/test_config_strict.py
- id: advisory-0.3.2-rejected-config
  what: An FRR config line the router rejected at boot was skipped silently
  record: advisories/0.3.2-rejected-config/README.md
  trust: "0.3.2 and earlier"
  tests:
    - tests/test_frr_config_load.py
    - tests/test_startup_config_load.py
- id: advisory-0.3.3-exec-not-checked
  what: A failed topology `exec:` command left the lab without that config
  record: advisories/0.3.3-exec-not-checked/README.md
  trust: "0.3.3 and earlier"
  tests:
    - tests/test_startup_config_load.py::test_audit_f1_an_exec_command_that_failed_fails_the_deploy
- id: eos-med-0
  what: On Arista EOS, `med 0` passed on a path received with no MED (cEOS prints MED 0 for both)
  record: CHANGELOG.md (0.4.0)
  trust: "0.3.3 and earlier"
  tests:
    - tests/test_interop_04_fixes.py
    - tests/test_interop_04.py::test_eos_missing_med_never_reads_as_0
    - tests/test_drivers_audit_033.py::test_med_zero_never_passes_on_a_path_without_med
- id: record-range-leak
  what: A baseline from `netdryrun record` (0.3.3, 0.4.0) passed a leaked customer prefix that kept the prefix count
    inside the recorded range
  record: advisories/0.4.0-record-prefix-range/README.md
  trust: "0.3.3 and 0.4.0"
  tests:
    - tests/test_false_passes_041.py
    - tests/test_redteam.py
    - tests/test_record.py
- id: prefix-without-length
  what: A prefix written without a length (`0.0.0.0`) was read as a host (/32 or /128), so a `present false` guard meant as
    "no default route" checked 0.0.0.0/32 and passed with 0.0.0.0/0 leaked (acceptance round B-1)
  record: CHANGELOG.md (0.4.1)
  tests:
    - tests/test_prefix_length.py
- id: verify-pin-explains-other-peer
  what: verify_change with `with` pins on appears_on explained every new path for the prefix, so a non-best path from
    an undeclared transit peer (a hijacker's origin AS) got INTENT MATCHED (acceptance round B-6)
  record: CHANGELOG.md (0.4.1); tests/redteam/RT-0035
  tests:
    - tests/test_acceptance_041.py
    - tests/test_verify_pins_041.py
- id: ipv6-neighbor-default-afi
  what: bgp_prefixes on an IPv6 neighbor without afi read the default ipv4-unicast, a family the session doesn't
    carry, so the count read 0 and a max bound passed while the neighbor sent 500 IPv6 prefixes (acceptance round B-2)
  record: CHANGELOG.md (0.4.1); tests/redteam/RT-0036
  tests:
    - tests/test_afi_default.py
    - tests/test_redteam.py
- id: family-not-carried-counted-zero
  what: A bgp_prefixes bound on a family the session doesn't carry counted 0 and passed, and record wrote nothing
    for that family, so an IPv6 leak over a session that later carried IPv6 passed the recorded file (acceptance
    round B-2, B-3)
  record: CHANGELOG.md (0.4.1)
  tests:
    - tests/test_afi_default.py
- id: inject-routes-never-left
  what: A scenario whose injected routes never left the injecting node (an outbound filter there) passed its max and
    present false checks on nothing, because the BGP gate only waits for counts to stop changing (acceptance round B-5)
  record: CHANGELOG.md (0.4.1)
  tests:
    - tests/test_verdict_runner.py
    - tests/test_inject_sent_counts.py
- id: redteam-20261101
  what: FRR route that failed to install counted as present; FRR well-known community names never matched; SR Linux
    bgp-evpn folded into bgp; protocol names a driver never reports accepted; EOS ospf6 never matched; SR Linux's own
    route taken as a BGP best path (RT-0021 to RT-0027)
  record: tests/redteam/README.md (RT-0021 to RT-0027); CHANGELOG.md (0.4.1)
  tests:
    - tests/test_false_passes_041.py
    - tests/test_redteam.py
- id: driver-reads-error-as-nothing
  what: A driver read a failed command, an unknown VRF or unexpected output as "no routes" or "no sessions"
  record: tests/redteam/README.md (RT-0008 and later)
  tests:
    - tests/test_driver_false_pass.py
    - tests/test_verdict_drivers.py
    - tests/test_driver_mutants_04.py
    - tests/test_junos_mutants.py
- id: verdict-mutants
  what: Mutations of the check, runner and config code that turn a failure into a pass
  record: tests/test_verdict_checks.py, tests/test_verdict_runner.py, tests/test_verdict_config.py
  tests:
    - tests/test_verdict_checks.py
    - tests/test_verdict_runner.py
    - tests/test_verdict_config.py
    - tests/test_runner_mutants.py
    - tests/test_inconclusive.py
- id: corpus-v1-misses-fixed
  what: Corpus v1 harmful changes approved by the v1 intent (18 redistribute connected, 23 third-party origin, 21 and
    30 latent filter removals) and the safe growth case 06 it blocked. The v1 verdicts stay losses; the v2 cases
    below make the same mistakes and are caught, and the live job fails if any of them stops being caught
  record: website/docs/how-its-built.md (Every miss, and what it changed)
  corpus: [v2/02-redistribute-connected-pe2, v2/03-test-prefix-left-in-config, v2/05-customer-max-prefix-removed,
           v2/06-peer-import-filter-permit-all, v2/07-customer-adds-prefixes]
  tests:
    - tests/test_verify_corpus.py
- id: corpus-v2-18-discard-route
  what: Corpus v2 case 18 (discard route for the aggregate deleted) was approved on a development build. It is
    listed in corpus/v2/NONDETERMINISTIC.yml, so the live job reports its verdict and does not fail on it
  record: corpus/v2/AMENDMENTS.md
  corpus: [v2/18-aggregate-discard-route-removed]
  tests: []
- id: drivers-harden-0.4.1
  what: Driver output read as present, absent or a plain value where the device said otherwise (acceptance round A-1 to
    A-7) - an EOS route type it couldn't map, an FRR path without AS-path segments read as local, an SR Linux family
    up without counters read as 0, an SR Linux route not in the FIB counted active, a Junos no-install static counted
    active, SR Linux AS-loop routes counted as received, a Junos graceful-restart stale route counted present
  record: CHANGELOG.md (0.4.1); tests/redteam/RT-0037 to RT-0043
  tests:
    - tests/test_drivers_harden_041.py
    - tests/test_srl_loop_count.py
    - tests/test_redteam.py
- id: advisory-0.4.0-further-false-passes
  what: The 15 further false passes in 0.4.0 and earlier, published together (prefix without a length, IPv6 default afi,
    families not carried, verify pins, FRR/SONiC/SR Linux/EOS/Junos driver cases, inject_routes never sent)
  record: advisories/0.4.0-further-false-passes/README.md
  trust: "0.4.0 and earlier"
  tests:
    - tests/test_prefix_length.py
    - tests/test_afi_default.py
    - tests/test_verify_pins_041.py
    - tests/test_false_passes_041.py
    - tests/test_exact_prefix_answers.py
    - tests/test_drivers_harden_041.py
    - tests/test_srl_loop_count.py
    - tests/test_inject_sent_counts.py
    - tests/test_redteam.py
