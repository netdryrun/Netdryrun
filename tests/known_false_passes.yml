    the count is now the range 1 to prefixAccepted
  record: advisories/0.4.2-addpath-prefix-count/README.md, CHANGELOG.md (0.4.2, Fixed)
  tests:
    - tests/oracles/FP-042-EOSADDPATH/test_oracle_fp_042_eosaddpath.py
    - tests/test_eos_addpath_042.py
    - tests/test_redteam.py
- id: rt-0070-frr-dampening-history-entry
  what: With `bgp dampening`, FRR keeps a withdrawn route listed as a dampening history entry, and the FRR and SONiC
    drivers read it as a received, not-selected BGP route, so `route protocol bgp active false` passed after the
    withdrawal (0.3.1 to 0.4.1; the default route 0.4.1 only, since a731395; red team on the 0.4.2 candidate,
    confirmed live on FRR 10.4.1); history and removed paths are no path now
  record: advisories/0.4.2-addpath-prefix-count/README.md, CHANGELOG.md (0.4.2, Fixed)
  tests:
    - tests/oracles/FP-042-FRRDAMP/test_oracle_fp_042_frrdamp.py
    - tests/test_frr_dampening_042.py
    - tests/test_redteam.py
- id: rt-0071-frr-history-entry-listed-as-received-prefix
  what: With `bgp dampening`, FRR keeps a withdrawn prefix in the neighbor's received listing as a history path, and
    the FRR and SONiC drivers' parse_received listed it, so `record` wrote it into `only` and the prefix coming back
    passed the recorded bgp_prefixes check (0.4.1, where `only:` and record's closed world came in; found by adversary
    review of the RT-0070 fix); a prefix whose paths are all withdrawn is no received prefix now
  record: advisories/0.4.2-addpath-prefix-count/README.md, CHANGELOG.md (0.4.2, Fixed)
  tests:
    - tests/oracles/FP-042-FRRRECVHIST/test_oracle_fp_042_frrrecvhist.py
    - tests/test_frr_received_history_042.py
    - tests/test_redteam.py
- id: rt-0072-frr-gr-stale-paths-counted
  what: During a BGP graceful restart with the peer's F-bit set, FRR keeps the peer's old paths marked stale until
    End-of-RIB and counts them in acceptedPrefixCounter, and the FRR and SONiC drivers read that counter, so
    `bgp_prefixes min 4` passed while the restarted peer sent 3 (FRR 0.1.0 and later, SONiC 0.2.0 and later; red team
    on the 0.4.2 candidate, confirmed live on FRR 10.4.1); a count with End-of-RIB pending under the F-bit is not
    settled now
  record: advisories/0.4.2-addpath-prefix-count/README.md, CHANGELOG.md (0.4.2, Fixed)
  tests:
    - tests/oracles/FP-042-FRRGRSTALE/test_oracle_fp_042_frrgrstale.py
    - tests/test_frr_gr_stale_042.py
    - tests/test_redteam.py
