    counter 0) as not carrying ipv4-unicast, so `bgp_prefixes afi ipv4-unicast exact: 0` passed while the node had the
    peer's routes installed as BGP IPv4 unicast routes, and record wrote that exact 0 (FRR 0.1.0 and SONiC 0.2.0 to
