  what: FRR and SONiC read a VRF's own addresses from `ip -j addr show vrf X`, which leaves out the VRF device itself,
    so a ping to an address on it (the usual VRF loopback) passed though the node answered it (case 3 of the 0.4.1
    advisory); 0.4.2 also reads `ip -j addr show dev X`
  record: CHANGELOG.md (0.4.2, Fixed), advisories/0.4.1-known-false-passes/README.md, website/docs/trust.md
  tests:
    - tests/oracles/FP-042-VRFDEV/test_oracle_fp_042_vrfdev.py
    - tests/test_frr_addpath_vrfdev_042.py
    - tests/test_redteam.py
- id: rt-0067-frr-addpath-prefix-count
  what: With add-path from the peer, FRR's acceptedPrefixCounter counts paths, and the FRR and SONiC drivers read it
    as the prefix count, so `bgp_prefixes min` passed on fewer prefixes (red team on the 0.4.2 candidate 79e6205,
    confirmed live on FRR 10.4.1); the driver now counts the prefixes the neighbor's routes listing gives
  record: advisories/0.4.2-addpath-prefix-count/README.md, CHANGELOG.md (0.4.2, Fixed)
  tests:
    - tests/oracles/FP-042-ADDPATH/test_oracle_fp_042_addpath.py
    - tests/test_frr_addpath_vrfdev_042.py
    - tests/test_redteam.py
- id: rt-0068-srl-addpath-prefix-count
  what: With add-path receive on SR Linux, the neighbor's received-routes counts paths, and the driver read it (minus
    rejected and AS-loop paths) as the prefix count, so `bgp_prefixes min` passed on fewer prefixes (0.1.0 to 0.4.1;
    red team on the 0.4.2 candidate, confirmed live on SR Linux 26.7.2); the driver now counts the distinct prefixes of
    the neighbor's paths in the local RIB
  record: advisories/0.4.2-addpath-prefix-count/README.md, CHANGELOG.md (0.4.2, Fixed)
  tests:
    - tests/oracles/FP-042-SRLADDPATH/test_oracle_fp_042_srladdpath.py
    - tests/test_srl_addpath_042.py
    - tests/test_redteam.py
- id: rt-0069-eos-addpath-prefix-count
  what: With additional-paths receive on Arista EOS (advertised by default), the summary's prefixAccepted counts paths,
