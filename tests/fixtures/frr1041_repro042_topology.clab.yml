name: ndr-repro042
topology:
  kinds:
    linux:
      image: quay.io/frrouting/frr:10.4.1
  nodes:
    r1:
      kind: linux
      binds: [configs/daemons:/etc/frr/daemons, configs/vtysh.conf:/etc/frr/vtysh.conf, configs/r1.conf:/etc/frr/frr.conf]
      exec:
        - ip link add RED type vrf table 1001
        - ip link set RED up
        - ip addr add 10.255.1.1/32 dev RED
    r2:
      kind: linux
      binds: [configs/daemons:/etc/frr/daemons, configs/vtysh.conf:/etc/frr/vtysh.conf, configs/r2.conf:/etc/frr/frr.conf]
    r3:
      kind: linux
      binds: [configs/daemons:/etc/frr/daemons, configs/vtysh.conf:/etc/frr/vtysh.conf, configs/r3.conf:/etc/frr/frr.conf]
  links:
    - endpoints: ["r1:eth1", "r2:eth1"]
    - endpoints: ["r2:eth2", "r3:eth1"]
