frr defaults traditional
hostname r1
!
ip route 198.51.101.0/24 blackhole
ip route 203.0.113.0/24 blackhole
!
bgp route-map delay-timer 0
!
interface lo
 ip address 10.255.0.1/32
!
interface eth1
 ip address 10.0.12.1/30
!
route-map EARLYDENY deny 10
exit
!
route-map ALL permit 10
exit
!
router bgp 65001
 bgp router-id 10.255.0.1
 neighbor 10.0.12.2 remote-as 65002
 address-family ipv4 unicast
  network 198.51.101.0/24 route-map EARLYDENY
  network 203.0.113.0/24
  neighbor 10.0.12.2 route-map ALL out
  neighbor 10.0.12.2 route-map ALL in
 exit-address-family
exit
!
