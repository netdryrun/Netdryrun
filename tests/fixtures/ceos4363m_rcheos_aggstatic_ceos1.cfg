service routing protocols model multi-agent
hostname ceos1
vrf instance blue
interface Ethernet1
   no switchport
   ip address 10.0.200.1/30
   ipv6 address 2001:db8:200::1/64
interface Loopback0
   ip address 192.168.30.1/32
interface Loopback1
   vrf blue
   ip address 192.168.31.1/32
ip routing
ip routing vrf blue
ipv6 unicast-routing
ipv6 unicast-routing vrf blue
ip route 10.66.1.0/24 Null0
ipv6 route 2001:db8:66:1::/64 Null0
ip route vrf blue 10.67.1.0/24 Null0
router bgp 65030
   router-id 30.30.30.30
   neighbor 10.0.200.2 remote-as 65020
   neighbor 2001:db8:200::2 remote-as 65020
   network 192.168.30.1/32
   network 10.66.1.0/24
   aggregate-address 10.66.0.0/16
   address-family ipv6
      neighbor 2001:db8:200::2 activate
      network 2001:db8:66:1::/64
      aggregate-address 2001:db8:66::/48
   vrf blue
      rd 1:1
      network 10.67.1.0/24
      aggregate-address 10.67.0.0/16
end
