service routing protocols model multi-agent
hostname ceos1
vrf instance blue
interface Ethernet1
   no switchport
   ip address 10.0.200.1/30
   ipv6 address 2001:db8:200::1/64
interface Loopback1
   vrf blue
   ip address 192.168.31.1/32
   ipv6 address 2001:db8:31::1/128
ip routing
ip routing vrf blue
ipv6 unicast-routing
ipv6 unicast-routing vrf blue
ip route 10.70.1.0/24 Null0
ip route 10.71.1.0/24 Null0
ip route 10.72.1.0/24 Null0
ip route 10.75.1.0/24 Null0
ip route 10.79.1.0/24 Null0
ip route 10.79.0.0/16 Null0
ip route 10.80.1.0/24 Null0
ip route 10.80.0.0/16 Null0
ipv6 route 2001:db8:78:1::/64 Null0
ipv6 route vrf blue 2001:db8:77:1::/64 Null0
route-map SETC permit 10
   set community 65000:1
route-map NOMATCH deny 10
router bgp 65030
   router-id 30.30.30.30
   neighbor 10.0.200.2 remote-as 65020
   neighbor 2001:db8:200::2 remote-as 65020
   network 10.70.1.0/24
   network 10.71.1.0/24
   network 10.72.1.0/24
   network 10.75.1.0/24
   network 10.79.1.0/24
   network 10.80.1.0/24
   aggregate-address 10.70.0.0/16 advertise-only
   aggregate-address 10.71.0.0/16 as-set summary-only
   aggregate-address 10.72.0.0/16 attribute-map SETC
   aggregate-address 10.73.0.0/16
   aggregate-address 10.74.0.0/16
   aggregate-address 10.75.0.0/16 match-map NOMATCH
   aggregate-address 10.79.0.0/16
   aggregate-address 10.80.0.0/16 advertise-only
   address-family ipv4
      no neighbor 2001:db8:200::2 activate
   address-family ipv6
      neighbor 2001:db8:200::2 activate
      network 2001:db8:78:1::/64
      aggregate-address 2001:db8:78::/48 as-set summary-only
   vrf blue
      rd 1:1
      address-family ipv6
         network 2001:db8:77:1::/64
         aggregate-address 2001:db8:77::/48
end
