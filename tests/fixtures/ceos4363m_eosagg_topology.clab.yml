name: ndr-eosagg
topology:
  nodes:
    ceos1: {kind: arista_ceos, image: "ceos:4.36.3M", startup-config: ceos1.cfg}
    frr2: {kind: linux, image: "quay.io/frrouting/frr:10.4.1", binds: [daemons:/etc/frr/daemons, vtysh.conf:/etc/frr/vtysh.conf, frr2.conf:/etc/frr/frr.conf]}
    up1: {kind: linux, image: "quay.io/frrouting/frr:10.4.1", binds: [daemons:/etc/frr/daemons, vtysh.conf:/etc/frr/vtysh.conf, up1.conf:/etc/frr/frr.conf]}
  links:
    - endpoints: ["ceos1:eth1", "up1:eth1"]
    - endpoints: ["frr2:eth1", "up1:eth2"]
