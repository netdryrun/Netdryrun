hostname ceos1
!
service routing protocols model multi-agent
!
interface Ethernet1
   no switchport
   ip address 10.0.200.1/30
!
interface Ethernet2
   no switchport
   ip address 10.0.201.1/30
   ip ospf network point-to-point
!
interface Loopback0
   ip address 192.168.30.1/32
!
ip routing
!
router bgp 65030
   router-id 30.30.30.30
   neighbor 10.0.200.2 remote-as 65020
   network 192.168.30.1/32
!
router ospf 1
   router-id 30.30.30.30
   network 10.0.201.0/30 area 0.0.0.0
!
end
