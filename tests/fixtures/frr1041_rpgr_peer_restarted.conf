frr defaults datacenter
hostname peer
!
interface eth1
 ip address 10.0.13.2/30
!
ip route 10.70.1.0/24 blackhole
ip route 10.70.2.0/24 blackhole
ip route 10.70.3.0/24 blackhole
!
router bgp 65002
 bgp router-id 2.2.2.2
 no bgp ebgp-requires-policy
 bgp graceful-restart
 bgp graceful-restart preserve-fw-state
 bgp graceful-restart restart-time 300
 coalesce-time 90000
 neighbor 10.0.13.1 remote-as 65001
 address-family ipv4 unicast
  network 10.70.1.0/24
  network 10.70.2.0/24
  network 10.70.3.0/24
 exit-address-family
!
