# The checks netdryrun 0.3.3 and 0.4.0 `record` wrote on the good config of this lab (examples/frr-customer-leak,
# its 0.4.1 file without the `only:` lists): prefix-count ranges, routes, standing guards. The ranges let a leak of
# one or two prefixes through (GHSA-cg9f-xjw5-38ph): prove must show the import-filter variant as survived.
lab: topology.clab.yml
timeout: 120
checks:
- type: bgp_session
  node: edge
  neighbor: 10.0.1.2
- type: bgp_prefixes
  node: edge
  neighbor: 10.0.1.2
  afi: ipv4-unicast
  min: 1
  max: 3
- type: bgp_session
  node: edge
  neighbor: 10.0.2.2
- type: bgp_prefixes
  node: edge
  neighbor: 10.0.2.2
  afi: ipv4-unicast
  min: 1
  max: 3
- type: route
  node: edge
  prefix: 10.10.0.0/24
  protocol: bgp
- type: route
  node: edge
  prefix: 198.51.100.0/24
  protocol: bgp
- type: route
  node: edge
  prefix: 0.0.0.0/0
  protocol: bgp
  present: false
- type: route
  node: edge
  prefix: 10.0.1.0/30
  protocol: bgp
  present: false
- type: route
  node: edge
  prefix: 10.0.2.0/30
  protocol: bgp
  present: false
- type: bgp_session
  node: cust
  neighbor: 10.0.1.1
- type: bgp_prefixes
  node: cust
  neighbor: 10.0.1.1
  afi: ipv4-unicast
  min: 1
  max: 3
- type: route
  node: cust
  prefix: 198.51.100.0/24
  protocol: bgp
- type: route
  node: cust
  prefix: 0.0.0.0/0
  protocol: bgp
  present: false
- type: route
  node: cust
  prefix: 10.0.1.0/30
  protocol: bgp
  present: false
- type: route
  node: cust
  prefix: 10.0.2.0/30
  protocol: bgp
  present: false
- type: bgp_session
  node: up
  neighbor: 10.0.2.1
- type: bgp_prefixes
  node: up
  neighbor: 10.0.2.1
  afi: ipv4-unicast
  min: 1
  max: 3
- type: route
  node: up
  prefix: 10.10.0.0/24
  protocol: bgp
- type: route
  node: up
  prefix: 0.0.0.0/0
  protocol: bgp
