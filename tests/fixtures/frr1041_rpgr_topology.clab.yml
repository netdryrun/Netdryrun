name: ndr-rpgr
topology:
  nodes:
    r1: {kind: linux, image: "quay.io/frrouting/frr:10.4.1", binds: [configs/daemons:/etc/frr/daemons, configs/vtysh.conf:/etc/frr/vtysh.conf, configs/r1.conf:/etc/frr/frr.conf]}
    peer: {kind: linux, image: "quay.io/frrouting/frr:10.4.1", binds: [configs/daemons:/etc/frr/daemons, configs/vtysh.conf:/etc/frr/vtysh.conf, configs/peer-live.conf:/etc/frr/frr.conf]}
  links:
    - endpoints: ["r1:eth1", "peer:eth1"]
