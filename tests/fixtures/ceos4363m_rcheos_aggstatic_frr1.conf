frr defaults traditional
hostname frr1
interface eth1
 ip address 10.0.200.2/30
 ipv6 address 2001:db8:200::2/64
ip route 10.66.0.0/16 Null0
ipv6 route 2001:db8:66::/48 Null0
router bgp 65020
 no bgp ebgp-requires-policy
 neighbor 10.0.200.1 remote-as 65030
 neighbor 2001:db8:200::1 remote-as 65030
 address-family ipv4 unicast
  redistribute static
 exit-address-family
 address-family ipv6 unicast
  neighbor 2001:db8:200::1 activate
  redistribute static
 exit-address-family
