# Where every file in tests/fixtures came from. The contributor CI (scripts/contrib_gate.py provenance) fails when a
# file has no entry here, or an entry matches no file. Add your fixture's entry in the same pull request.
#
#   files    globs, relative to tests/fixtures
#   kind     live-capture   output a NOS printed in a running lab (the only kind a parser test may be built on)
#            lab-input      a topology or config fed to a lab, not output
#            report         a report Netdryrun wrote on a real run
#   source   the lab, NOS version and how it was captured, as far as it was recorded when the file was added
#   added    the commit that added it, or last re-captured it
#
# Where the adding commit didn't name the lab or the version, the entry says so instead of guessing.
# Contributed captures don't go here: they go in captures/ as bundles with their own manifest.json.

