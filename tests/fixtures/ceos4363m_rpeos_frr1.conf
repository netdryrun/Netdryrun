frr defaults datacenter
hostname frr1
!
interface eth1
 ip address 10.0.200.2/30
!
interface eth2
 ip address 10.0.12.1/30
!
ip route 10.40.0.0/24 blackhole
ip route 10.41.0.0/24 blackhole
!
router bgp 65020
 bgp router-id 20.20.20.20
 no bgp ebgp-requires-policy
 neighbor 10.0.200.1 remote-as 65030
 neighbor 10.0.12.2 remote-as 65021
 address-family ipv4 unicast
  network 10.40.0.0/24
  network 10.41.0.0/24
  neighbor 10.0.200.1 addpath-tx-all-paths
 exit-address-family
!
