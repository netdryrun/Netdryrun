frr defaults traditional
hostname up1
interface eth1
 ip address 10.0.200.2/30
 ipv6 address 2001:db8:200::2/64
interface eth2
 ip address 10.0.210.2/30
 ipv6 address 2001:db8:210::2/64
ip route 10.66.2.0/24 blackhole
ip route 10.66.0.0/16 blackhole
ipv6 route 2001:db8:66:2::/64 blackhole
ipv6 route 2001:db8:66::/48 blackhole
route-map NONE deny 10
router bgp 65020
 bgp router-id 20.20.20.20
 no bgp ebgp-requires-policy
 neighbor 10.0.200.1 remote-as 65030
 neighbor 2001:db8:200::1 remote-as 65030
 neighbor 10.0.210.1 remote-as 65040
 neighbor 2001:db8:210::1 remote-as 65040
 address-family ipv4 unicast
  neighbor 10.0.200.1 route-map NONE in
  neighbor 10.0.210.1 route-map NONE in
  no neighbor 2001:db8:200::1 activate
  no neighbor 2001:db8:210::1 activate
 exit-address-family
 address-family ipv6 unicast
  neighbor 2001:db8:200::1 activate
  neighbor 2001:db8:210::1 activate
  neighbor 2001:db8:200::1 route-map NONE in
  neighbor 2001:db8:210::1 route-map NONE in
 exit-address-family
