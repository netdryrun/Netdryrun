policy-options {
    prefix-list OUR-ROUTES {
        192.0.2.0/24;
    }
    prefix-list CUST3-BLOCKS {
        10.103.0.0/24;
    }
    policy-statement CUST3-IN {
        term ok {
            from {
                prefix-list-filter CUST3-BLOCKS exact;
            }
            then accept;
        }
        then reject;
    }
    policy-statement TO-UPSTREAM {
        term ours {
            from prefix-list OUR-ROUTES;
            then accept;
        }
        term cust3 {
            from prefix-list CUST3-BLOCKS;
            then accept;
        }
        then reject;
    }
}
protocols {
    bgp {
        group UPSTREAM {
            type external;
            peer-as 65200;
            export TO-UPSTREAM;
            neighbor 10.0.2.2;
        }
        group CUST3 {
            type external;
            peer-as 65103;
            import CUST3-IN;
            neighbor 10.0.3.2;
        }
    }
}
