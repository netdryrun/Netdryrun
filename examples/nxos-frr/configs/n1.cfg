feature bgp
interface Ethernet1/1
  no switchport
  ip address 10.0.100.1/30
  no shutdown
interface loopback0
  ip address 192.168.10.1/32
ip route 0.0.0.0/0 Null0
ip prefix-list OWN-LAN seq 10 permit 192.168.10.1/32
route-map EXPORT-OWN permit 10
  match ip address prefix-list OWN-LAN
route-map ACCEPT-ALL permit 10
router bgp 65010
  router-id 10.10.10.10
  address-family ipv4 unicast
    network 192.168.10.1/32
  neighbor 10.0.100.2
    remote-as 65020
    address-family ipv4 unicast
      route-map ACCEPT-ALL in
      route-map EXPORT-OWN out
