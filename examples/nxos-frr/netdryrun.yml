# Cisco NX-OS (Nexus 9000v, beta driver) and FRR. Run: netdryrun run examples/nxos-frr
# The good configs pass. leaks/frr1.conf (FRR sends a default route it shouldn't) fails exactly the
# two leak guards on n1: the leaked default is received but never installed, because n1's own static
# default wins. See README.md.
lab: topology.clab.yml
timeout: 900   # the Nexus 9000v VM boots in several minutes before NX-OS answers

checks:
  - type: bgp_session
    node: n1
    neighbor: 10.0.100.2
  - type: bgp_session
    node: frr1
    neighbor: 10.0.100.1
  - type: bgp_prefixes
    node: n1
    neighbor: 10.0.100.2
    min: 1
  - type: route
    node: n1
    prefix: 192.168.20.0/24
    protocol: bgp
  - type: route
    node: frr1
    prefix: 192.168.10.1/32
    protocol: bgp
  - type: bgp_route
    node: n1
    prefix: 192.168.20.0/24
    as_path: "65020"
    next_hop: 10.0.100.2
  - type: ping
    node: n1
    source: 192.168.10.1
    target: 192.168.20.1
  - type: route        # n1's own default route is in place and selected
    node: n1
    prefix: 0.0.0.0/0
    protocol: static

  # The leak guards: no BGP path for 0.0.0.0/0 on n1, installed or not.
  - type: route
    node: n1
    prefix: 0.0.0.0/0
    protocol: bgp
    present: false
  - type: bgp_route
    node: n1
    prefix: 0.0.0.0/0
    present: false
