# Cisco NX-OS (Nexus 9000v, beta driver) peering eBGP with FRR. Bring your own image: download the
# Nexus 9000v qcow2 from Cisco and build it with vrnetlab (see README.md). It can't be redistributed.
name: ndr-nxos-frr

topology:
  nodes:
    n1:
      kind: cisco_n9kv
      image: vrnetlab/cisco_n9kv:9300-10.4.8.M
      startup-config: configs/n1.cfg
    frr1:
      kind: linux
      image: quay.io/frrouting/frr:10.4.1
      binds:
        - configs/daemons:/etc/frr/daemons
        - configs/vtysh.conf:/etc/frr/vtysh.conf
        - configs/frr1.conf:/etc/frr/frr.conf
      exec:
        # containerlab gives linux nodes a default route via the management network. FRR sees it as a
        # kernel route with distance 0, which would beat its static default.
        - ip route del default
  links:
    - endpoints: ["n1:eth1", "frr1:eth1"]
