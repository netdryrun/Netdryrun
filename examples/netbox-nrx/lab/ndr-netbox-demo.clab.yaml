name: ndr-netbox-demo
topology:
    nodes:
        r1:
            kind: linux
            image: quay.io/frrouting/frr:10.4.1
            binds:
                - daemons:/etc/frr/daemons
                - vtysh.conf:/etc/frr/vtysh.conf
                - r1.config:/etc/frr/frr.conf
            labels:
                graph-icon: router
                graph-level: 6
                role: router
                group: demo-dc1
                platform: FRR
                vendor: FRRouting
                model: frr-router

        r2:
            kind: linux
            image: quay.io/frrouting/frr:10.4.1
            binds:
                - daemons:/etc/frr/daemons
                - vtysh.conf:/etc/frr/vtysh.conf
                - r2.config:/etc/frr/frr.conf
            labels:
                graph-icon: router
                graph-level: 6
                role: router
                group: demo-dc1
                platform: FRR
                vendor: FRRouting
                model: frr-router

        r3:
            kind: linux
            image: quay.io/frrouting/frr:10.4.1
            binds:
                - daemons:/etc/frr/daemons
                - vtysh.conf:/etc/frr/vtysh.conf
                - r3.config:/etc/frr/frr.conf
            labels:
                graph-icon: router
                graph-level: 6
                role: router
                group: demo-dc1
                platform: FRR
                vendor: FRRouting
                model: frr-router

        r4:
            kind: linux
            image: quay.io/frrouting/frr:10.4.1
            binds:
                - daemons:/etc/frr/daemons
                - vtysh.conf:/etc/frr/vtysh.conf
                - r4.config:/etc/frr/frr.conf
            labels:
                graph-icon: router
                graph-level: 6
                role: router
                group: demo-dc1
                platform: FRR
                vendor: FRRouting
                model: frr-router

    links:
        - endpoints: ["r1:eth1", "r2:eth1"]
        - endpoints: ["r2:eth2", "r3:eth1"]
        - endpoints: ["r3:eth2", "r4:eth1"]
        - endpoints: ["r4:eth2", "r1:eth2"]
