# MikroTik RouterOS 7 (CHR, beta driver) peering eBGP with FRR. Bring your own image: download the CHR VMDK from
# MikroTik and build it with vrnetlab (see README.md). It can't be redistributed. One CHR node per lab.
name: ndr-mikrotik-frr

topology:
  nodes:
    r1:
      kind: mikrotik_ros
      image: vrnetlab/mikrotik_routeros:7.23.8
      startup-config: configs/r1.rsc
    frr1:
      kind: linux
      image: quay.io/frrouting/frr:10.4.1
      binds:
        - configs/daemons:/etc/frr/daemons
        - configs/vtysh.conf:/etc/frr/vtysh.conf
        - configs/frr1.conf:/etc/frr/frr.conf
      exec:
        # containerlab gives linux nodes a default route via the management network. FRR sees it as a
        # kernel route with distance 0, which would beat its static default.
        - ip route del default
  links:
    - endpoints: ["r1:eth1", "frr1:eth1"]
