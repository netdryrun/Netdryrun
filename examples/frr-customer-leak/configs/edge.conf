frr defaults datacenter
hostname edge
!
interface eth1
 description cust (customer, AS 65010)
 ip address 10.0.1.1/30
!
interface eth2
 description up (upstream, AS 65020)
 ip address 10.0.2.1/30
!
! The customer may announce its own block, 10.10.0.0/24, and nothing else
ip prefix-list CUST-IN seq 10 permit 10.10.0.0/24
!
route-map CUST-IN permit 10
 match ip address prefix-list CUST-IN
!
route-map ALLOW-ALL permit 10
!
router bgp 65000
 bgp router-id 10.0.0.1
 neighbor 10.0.1.2 remote-as 65010
 neighbor 10.0.2.2 remote-as 65020
 address-family ipv4 unicast
  neighbor 10.0.1.2 route-map CUST-IN in
  neighbor 10.0.1.2 route-map ALLOW-ALL out
  neighbor 10.0.2.2 route-map ALLOW-ALL in
  neighbor 10.0.2.2 route-map ALLOW-ALL out
 exit-address-family
!
