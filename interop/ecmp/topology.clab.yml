# FRR-only sub-lab (run 2, S11 follow-up): fa peers fb over two parallel links; fb (multipath) re-advertises fa's
# loopback to fc. Reproduces the verify "several paths without addpathTxId" refusal on FRR alone.
name: ndr-interop-ecmp
topology:
  nodes:
    fa: {kind: linux, image: quay.io/frrouting/frr:10.4.1, binds: [configs/daemons:/etc/frr/daemons, configs/vtysh.conf:/etc/frr/vtysh.conf, configs/fa.conf:/etc/frr/frr.conf], exec: [ip route del default]}
    fb: {kind: linux, image: quay.io/frrouting/frr:10.4.1, binds: [configs/daemons:/etc/frr/daemons, configs/vtysh.conf:/etc/frr/vtysh.conf, configs/fb.conf:/etc/frr/frr.conf], exec: [ip route del default]}
    fc: {kind: linux, image: quay.io/frrouting/frr:10.4.1, binds: [configs/daemons:/etc/frr/daemons, configs/vtysh.conf:/etc/frr/vtysh.conf, configs/fc.conf:/etc/frr/frr.conf], exec: [ip route del default]}
  links:
    - endpoints: ["fa:eth1", "fb:eth1"]
    - endpoints: ["fa:eth2", "fb:eth2"]
    - endpoints: ["fb:eth3", "fc:eth1"]
