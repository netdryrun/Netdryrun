frr defaults datacenter
hostname fa
interface lo
 ip address 192.168.3.1/32
interface eth1
 ip address 10.9.1.1/30
interface eth2
 ip address 10.9.2.1/30
route-map ALL permit 10
router bgp 65003
 bgp router-id 3.3.3.3
 neighbor 10.9.1.2 remote-as 65005
 neighbor 10.9.2.2 remote-as 65005
 address-family ipv4 unicast
  network 192.168.3.1/32
  neighbor 10.9.1.2 route-map ALL in
  neighbor 10.9.1.2 route-map ALL out
  neighbor 10.9.2.2 route-map ALL in
  neighbor 10.9.2.2 route-map ALL out
 exit-address-family
