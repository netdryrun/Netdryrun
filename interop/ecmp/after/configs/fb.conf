frr defaults datacenter
hostname fb
interface eth1
 ip address 10.9.1.2/30
interface eth2
 ip address 10.9.2.2/30
interface eth3
 ip address 10.9.3.1/30
route-map ALL permit 10
router bgp 65005
 bgp router-id 5.5.5.5
 bgp bestpath compare-routerid
 neighbor 10.9.1.1 remote-as 65003
 neighbor 10.9.2.1 remote-as 65003
 neighbor 10.9.3.2 remote-as 65002
 address-family ipv4 unicast
  neighbor 10.9.1.1 route-map ALL in
  neighbor 10.9.1.1 route-map ALL out
  neighbor 10.9.2.1 route-map ALL in
  neighbor 10.9.2.1 route-map ALL out
  neighbor 10.9.3.2 route-map ALL in
  neighbor 10.9.3.2 route-map ALL out
 exit-address-family
