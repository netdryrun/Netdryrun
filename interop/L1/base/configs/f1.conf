frr defaults datacenter
hostname f1
!
interface lo
 ip address 192.168.5.1/32
 ipv6 address 2001:db8:5::1/128
!
interface eth1
 ip address 10.1.1.2/30
 ipv6 address 2001:db8:11::2/64
!
interface eth2
 ip address 10.1.2.2/30
 ipv6 address 2001:db8:12::2/64
!
interface eth3
 ip address 10.1.3.2/30
!
interface eth4
 ip address 10.1.4.2/30
!
interface eth5
 ip address 10.1.5.2/30
!
interface eth6
 ip address 10.1.7.2/30
!
ip prefix-list DEFAULT seq 10 permit 0.0.0.0/0
ip prefix-list F2-LAN seq 10 permit 192.168.6.0/24
!
route-map ACCEPT-ALL permit 10
!
route-map TO-SPOKE deny 10
 match ip address prefix-list DEFAULT
!
route-map TO-SPOKE permit 100
!
route-map TO-SPOKE6 permit 10
!
route-map TO-UPSTREAM permit 10
!
router bgp 65005
 bgp router-id 5.5.5.5
 bgp bestpath compare-routerid
 neighbor 10.1.1.1 remote-as 65001
 neighbor 10.1.1.1 sender-as-path-loop-detection
 neighbor 10.1.2.1 remote-as 65002
 neighbor 10.1.2.1 sender-as-path-loop-detection
 neighbor 10.1.3.1 remote-as 65003
 neighbor 10.1.3.1 sender-as-path-loop-detection
 neighbor 10.1.7.1 remote-as 65003
 neighbor 10.1.7.1 sender-as-path-loop-detection
 neighbor 10.1.4.1 remote-as 65004
 neighbor 10.1.4.1 sender-as-path-loop-detection
 neighbor 10.1.5.1 remote-as 65006
 neighbor 2001:db8:11::1 remote-as 65001
 neighbor 2001:db8:11::1 sender-as-path-loop-detection
 neighbor 2001:db8:12::1 remote-as 65002
 neighbor 2001:db8:12::1 sender-as-path-loop-detection
 address-family ipv4 unicast
  network 192.168.5.1/32
  aggregate-address 172.16.0.0/16 as-set summary-only
  neighbor 10.1.1.1 route-map ACCEPT-ALL in
  neighbor 10.1.1.1 route-map TO-SPOKE out
  neighbor 10.1.2.1 route-map ACCEPT-ALL in
  neighbor 10.1.2.1 route-map TO-SPOKE out
  neighbor 10.1.3.1 route-map ACCEPT-ALL in
  neighbor 10.1.3.1 route-map TO-SPOKE out
  neighbor 10.1.7.1 route-map ACCEPT-ALL in
  neighbor 10.1.7.1 route-map TO-SPOKE out
  neighbor 10.1.4.1 route-map ACCEPT-ALL in
  neighbor 10.1.4.1 route-map TO-SPOKE out
  neighbor 10.1.5.1 route-map ACCEPT-ALL in
  neighbor 10.1.5.1 route-map TO-UPSTREAM out
  no neighbor 2001:db8:11::1 activate
  no neighbor 2001:db8:12::1 activate
 exit-address-family
 address-family ipv6 unicast
  network 2001:db8:5::1/128
  neighbor 2001:db8:11::1 activate
  neighbor 2001:db8:11::1 route-map ACCEPT-ALL in
  neighbor 2001:db8:11::1 route-map TO-SPOKE6 out
  neighbor 2001:db8:12::1 activate
  neighbor 2001:db8:12::1 route-map ACCEPT-ALL in
  neighbor 2001:db8:12::1 route-map TO-SPOKE6 out
 exit-address-family
!
