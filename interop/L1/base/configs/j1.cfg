system {
    host-name j1;
    login {
        user admin {
            uid 500;
            class superuser;
            authentication {
                encrypted-password "$6$9YSzwiCD$ZiMI1N.5fcWCe5fH8hZz/FtISY4K8QKjv9p0w6Hkyct71ke1bn3OQQk0oi7/l5Sn8yP1CClO9CeGSMpNQcFjT/"; ## SECRET-DATA
            }
        }
    }
    management-instance;
    services {
        netconf {
            ssh;
        }
        ssh {
            root-login allow;
        }
    }
}
interfaces {
    et-0/0/0 {
        unit 0 {
            family inet {
                address 10.1.1.1/30;
            }
            family inet6 {
                address 2001:db8:11::1/64;
            }
        }
    }
    lo0 {
        unit 0 {
            family inet {
                address 192.168.1.1/32;
            }
            family inet6 {
                address 2001:db8:1::1/128;
            }
        }
    }
    re0:mgmt-0 {
        unit 0 {
            family inet {
                address FXP0ADDR;
            }
        }
    }
}
policy-options {
    policy-statement EXPORT-OWN {
        term lan {
            from {
                route-filter 192.168.1.1/32 exact;
            }
            then {
                community add J1-STD;
                community add J1-LARGE;
                metric 10;
                accept;
            }
        }
        term cust {
            from {
                protocol static;
                route-filter 172.17.1.0/24 exact;
            }
            then accept;
        }
        term rest {
            then reject;
        }
    }
    policy-statement EXPORT-OWN6 {
        term lan {
            from {
                route-filter 2001:db8:1::1/128 exact;
            }
            then accept;
        }
        term rest {
            then reject;
        }
    }
    policy-statement ACCEPT-ALL {
        then accept;
    }
    community J1-STD members 65001:100;
    community J1-LARGE members large:65001:1:1;
}
routing-options {
    router-id 1.1.1.1;
    autonomous-system 65001;
    static {
        route 0.0.0.0/0 discard;
        route 172.17.1.0/24 discard;
        route 172.17.1.128/25 discard;
    }
}
protocols {
    bgp {
        group f1 {
            type external;
            peer-as 65005;
            import ACCEPT-ALL;
            export EXPORT-OWN;
            neighbor 10.1.1.2;
        }
        group f1-v6 {
            type external;
            peer-as 65005;
            family inet6 {
                unicast;
            }
            import ACCEPT-ALL;
            export EXPORT-OWN6;
            neighbor 2001:db8:11::2;
        }
    }
}
