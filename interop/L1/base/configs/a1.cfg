hostname a1
!
service routing protocols model multi-agent
!
interface Ethernet1
   no switchport
   ip address 10.1.3.1/30
!
interface Ethernet2
   no switchport
   ip address 10.1.7.1/30
!
interface Loopback0
   ip address 192.168.3.1/32
!
ip routing
!
ip route 0.0.0.0/0 Null0
!
ip prefix-list OWN seq 10 permit 192.168.3.1/32
!
route-map EXPORT permit 10
   match ip address prefix-list OWN
   set community 65003:100
   set large-community 65003:1:1
   set metric 30
   set as-path prepend 65003
!
route-map ACCEPT-ALL permit 10
!
router bgp 65003
   router-id 3.3.3.3
   maximum-paths 2
   neighbor 10.1.3.2 remote-as 65005
   neighbor 10.1.3.2 send-community
   neighbor 10.1.3.2 route-map ACCEPT-ALL in
   neighbor 10.1.3.2 route-map EXPORT out
   neighbor 10.1.7.2 remote-as 65005
   neighbor 10.1.7.2 send-community
   neighbor 10.1.7.2 route-map ACCEPT-ALL in
   neighbor 10.1.7.2 route-map EXPORT out
   network 192.168.3.1/32
!
end
