# L1 overlays: each is one change to the baseline. `edits` build the fresh-deploy copy (exact text replaced once in
# a copy of base/); `apply` and `revert` change the running lab (typed per NOS, run by tools/lab.py); `probe` is
# raw state read after a run so a verdict can be tied to what the device actually had.
# fresh: number of fresh deploys (3 where a false pass is possible); reapply: also applied on the running lab.
lab: L1
overlays:
  M01:
    scenario: S1
    title: f1 leaks the upstream default to every spoke (deny clause removed from TO-SPOKE)
    fresh: 3
    reapply: true
    edits:
      - file: configs/f1.conf
        replace: "route-map TO-SPOKE deny 10\n match ip address prefix-list DEFAULT\n!\n"
        with: ""
    apply:
      - {node: f1, vtysh: ["no route-map TO-SPOKE deny 10"]}
    revert:
      - {node: f1, vtysh: ["route-map TO-SPOKE deny 10", "match ip address prefix-list DEFAULT"]}
    probe:
      - {node: j1, junos: "show route 0.0.0.0/0 exact"}
      - {node: s1, srl: "show network-instance default protocols bgp routes ipv4 prefix 0.0.0.0/0"}
      - {node: a1, eos: "show ip bgp 0.0.0.0/0"}
      - {node: n1, vtysh1: "show bgp ipv4 unicast 0.0.0.0/0"}

  M02:
    scenario: S1
    title: j1 export term widened from exact to orlonger (leaks 172.17.1.128/25)
    fresh: 3
    reapply: true
    edits:
      - file: configs/j1.cfg
        replace: "route-filter 172.17.1.0/24 exact;"
        with: "route-filter 172.17.1.0/24 orlonger;"
    apply:
      - {node: j1, junos: ["delete policy-options policy-statement EXPORT-OWN term cust from route-filter 172.17.1.0/24 exact",
                           "set policy-options policy-statement EXPORT-OWN term cust from route-filter 172.17.1.0/24 orlonger"]}
    revert:
      - {node: j1, junos: ["delete policy-options policy-statement EXPORT-OWN term cust from route-filter 172.17.1.0/24 orlonger",
                           "set policy-options policy-statement EXPORT-OWN term cust from route-filter 172.17.1.0/24 exact"]}
    probe:
      - {node: f1, vtysh1: "show bgp ipv4 unicast 172.17.1.128/25"}
      - {node: s1, srl: "show network-instance default protocols bgp routes ipv4 prefix 172.17.1.128/25"}
      - {node: a1, eos: "show ip bgp 172.17.1.128/25"}

  M03:
    scenario: S2
    title: a1 stops setting its large community
    fresh: 3
    reapply: true
    edits:
      - file: configs/a1.cfg
        replace: "   set large-community 65003:1:1\n"
        with: ""
    apply:
      - {node: a1, eos: ["route-map EXPORT permit 10", "no set large-community 65003:1:1"]}
    revert:
      - {node: a1, eos: ["route-map EXPORT permit 10", "set large-community 65003:1:1"]}
    probe:
      - {node: f1, vtysh1: "show bgp ipv4 unicast 192.168.3.1/32"}
      - {node: j1, junos: "show route 192.168.3.1/32 exact detail"}

  M04:
    scenario: S2
    title: f1 adds well-known community no-export to the upstream LAN toward the spokes
    fresh: 3
    reapply: true
    edits:
      - file: configs/f1.conf
        replace: "route-map TO-SPOKE permit 100\n"
        with: "route-map TO-SPOKE permit 20\n match ip address prefix-list F2-LAN\n set community no-export additive\n!\nroute-map TO-SPOKE permit 100\n"
    apply:
      - {node: f1, vtysh: ["route-map TO-SPOKE permit 20", "match ip address prefix-list F2-LAN", "set community no-export additive"]}
    revert:
      - {node: f1, vtysh: ["no route-map TO-SPOKE permit 20"]}
    probe:
      - {node: j1, junos: "show route 192.168.6.0/24 exact detail"}
      - {node: s1, srl: "show network-instance default protocols bgp routes ipv4 prefix 192.168.6.0/24 detail"}
      - {node: a1, eos: "show ip bgp 192.168.6.0/24"}

  M05:
    scenario: S2
    title: a1 removes its AS-path prepend
    fresh: 0
    reapply: true
    edits:
      - file: configs/a1.cfg
        replace: "   set as-path prepend 65003\n"
        with: ""
    apply:
      - {node: a1, eos: ["route-map EXPORT permit 10", "no set as-path prepend 65003"]}
    revert:
      - {node: a1, eos: ["route-map EXPORT permit 10", "set as-path prepend 65003"]}
    probe:
      - {node: f1, vtysh1: "show bgp ipv4 unicast 192.168.3.1/32"}

  M06:
    scenario: S4
    title: j1 import policy rejects the upstream LAN 192.168.6.0/24
    fresh: 1          # the one fresh deploy that confirms the reapply path for L1
    reapply: true
    edits:
      - file: configs/j1.cfg
        replace: "    policy-statement ACCEPT-ALL {\n        then accept;\n    }\n"
        with: "    policy-statement ACCEPT-ALL {\n        term drop-f2-lan {\n            from {\n                route-filter 192.168.6.0/24 exact;\n            }\n            then reject;\n        }\n        then accept;\n    }\n"
    apply:
      - {node: j1, junos: ["set policy-options policy-statement ACCEPT-ALL term drop-f2-lan from route-filter 192.168.6.0/24 exact",
                           "set policy-options policy-statement ACCEPT-ALL term drop-f2-lan then reject"]}
    revert:
      - {node: j1, junos: ["delete policy-options policy-statement ACCEPT-ALL term drop-f2-lan"]}
    probe:
      - {node: j1, junos: "show route 192.168.6.0/24 exact table inet.0 all extensive"}

  M07:
    scenario: S4
    title: s1 import policy rejects the upstream LAN 192.168.6.0/24
    fresh: 0
    reapply: true
    edits:
      - file: configs/s1.cli
        append: |
          set / routing-policy prefix-set f2-lan prefix 192.168.6.0/24 mask-length-range exact
          set / routing-policy policy import-f1 default-action policy-result accept
          set / routing-policy policy import-f1 statement drop match prefix prefix-set f2-lan
          set / routing-policy policy import-f1 statement drop action policy-result reject
          set / network-instance default protocols bgp group ebgp import-policy [ import-f1 ]
    apply:
      - {node: s1, srl: ["set / routing-policy prefix-set f2-lan prefix 192.168.6.0/24 mask-length-range exact",
                         "set / routing-policy policy import-f1 default-action policy-result accept",
                         "set / routing-policy policy import-f1 statement drop match prefix prefix-set f2-lan",
                         "set / routing-policy policy import-f1 statement drop action policy-result reject",
                         "set / network-instance default protocols bgp group ebgp import-policy [ import-f1 ]"]}
    revert:
      - {node: s1, srl: ["set / network-instance default protocols bgp group ebgp import-policy [ accept-all ]",
                         "delete / routing-policy policy import-f1",
                         "delete / routing-policy prefix-set f2-lan"]}
    probe:
      - {node: s1, srl: "show network-instance default protocols bgp neighbor 10.1.2.2"}

  M08:
    scenario: S4
    title: a1 import policy rejects the upstream LAN 192.168.6.0/24
    fresh: 0
    reapply: true
    edits:
      - file: configs/a1.cfg
        replace: "route-map ACCEPT-ALL permit 10\n"
        with: "ip prefix-list F2LAN seq 10 permit 192.168.6.0/24\n!\nroute-map ACCEPT-ALL deny 5\n   match ip address prefix-list F2LAN\n!\nroute-map ACCEPT-ALL permit 10\n"
    apply:
      - {node: a1, eos: ["ip prefix-list F2LAN seq 10 permit 192.168.6.0/24", "route-map ACCEPT-ALL deny 5",
                         "match ip address prefix-list F2LAN"]}
    revert:
      - {node: a1, eos: ["no route-map ACCEPT-ALL deny 5", "no ip prefix-list F2LAN"]}
    probe:
      - {node: a1, eos: "show ip bgp 192.168.6.0/24"}
      - {node: a1, eos: "show ip bgp summary"}

  M09:
    scenario: S5
    title: f1 sets an unreachable third-party next hop (10.99.99.99) on the upstream LAN toward the spokes
    fresh: 1
    reapply: 3        # reapply x3 instead of fresh x3: its failing positive checks wait the full fresh timeout
    edits:
      - file: configs/f1.conf
        replace: "route-map TO-SPOKE permit 100\n"
        with: "route-map TO-SPOKE permit 20\n match ip address prefix-list F2-LAN\n set ip next-hop 10.99.99.99\n!\nroute-map TO-SPOKE permit 100\n"
    apply:
      - {node: f1, vtysh: ["route-map TO-SPOKE permit 20", "match ip address prefix-list F2-LAN", "set ip next-hop 10.99.99.99"]}
    revert:
      - {node: f1, vtysh: ["no route-map TO-SPOKE permit 20"]}
    probe:
      - {node: j1, junos: "show route 192.168.6.0/24 exact table inet.0 all extensive"}
      - {node: j1, junos: "show bgp neighbor 10.1.1.2"}
      - {node: s1, srl: "show network-instance default protocols bgp routes ipv4 prefix 192.168.6.0/24 detail"}
      - {node: a1, eos: "show ip bgp 192.168.6.0/24"}
      - {node: a1, eos: "show ip bgp summary"}
      - {node: n1, vtysh1: "show bgp ipv4 unicast 192.168.6.0/24"}

  M10:
    scenario: S6
    spread: 150       # outlast a graceful-restart stale timer (120 s) before checking (model review, Grok)
    title: j1 IPv4 prefix limit 100 with teardown, idle forever (receives 206)
    fresh: 0
    reapply: true
    edits:
      - file: configs/j1.cfg
        replace: "            peer-as 65005;\n            import ACCEPT-ALL;\n            export EXPORT-OWN;\n"
        with: "            peer-as 65005;\n            family inet {\n                unicast {\n                    prefix-limit {\n                        maximum 100;\n                        teardown idle-timeout forever;\n                    }\n                }\n            }\n            import ACCEPT-ALL;\n            export EXPORT-OWN;\n"
    apply:
      - {node: j1, junos: ["set protocols bgp group f1 family inet unicast prefix-limit maximum 100",
                           "set protocols bgp group f1 family inet unicast prefix-limit teardown idle-timeout forever"]}
    revert:
      - {node: j1, junos: ["delete protocols bgp group f1 family inet"]}
      - {node: j1, junos_op: "clear bgp neighbor 10.1.1.2"}
    probe:
      - {node: j1, junos: "show bgp summary"}

  M11:
    scenario: S6
    spread: 150       # outlast a graceful-restart stale timer (120 s) before checking (model review, Grok)
    title: s1 wrong peer AS (65015) on its IPv4 session
    fresh: 0
    reapply: true
    edits:
      - file: configs/s1.cli
        append: "set / network-instance default protocols bgp neighbor 10.1.2.2 peer-as 65015\n"
    apply:
      - {node: s1, srl: ["set / network-instance default protocols bgp neighbor 10.1.2.2 peer-as 65015"]}
    revert:
      - {node: s1, srl: ["set / network-instance default protocols bgp neighbor 10.1.2.2 peer-as 65005"]}
    probe:
      - {node: s1, srl: "show network-instance default protocols bgp neighbor"}

  M12:
    scenario: S6
    spread: 150       # outlast a graceful-restart stale timer (120 s) before checking (model review, Grok)
    title: a1 administratively shuts its session on link3 (link7 stays up)
    fresh: 0
    reapply: true
    edits:
      - file: configs/a1.cfg
        replace: "   neighbor 10.1.3.2 remote-as 65005\n"
        with: "   neighbor 10.1.3.2 remote-as 65005\n   neighbor 10.1.3.2 shutdown\n"
    apply:
      - {node: a1, eos: ["router bgp 65003", "neighbor 10.1.3.2 shutdown"]}
    revert:
      - {node: a1, eos: ["router bgp 65003", "no neighbor 10.1.3.2 shutdown"]}
    probe:
      - {node: a1, eos: "show ip bgp summary"}

  M13:
    scenario: S6
    spread: 150       # outlast a graceful-restart stale timer (120 s) before checking (model review, Grok)
    title: MD5 password on f1 toward n1 only (mismatch)
    fresh: 0
    reapply: true
    edits:
      - file: configs/f1.conf
        replace: " neighbor 10.1.4.1 remote-as 65004\n"
        with: " neighbor 10.1.4.1 remote-as 65004\n neighbor 10.1.4.1 password ndrmd5test\n"
    apply:
      - {node: f1, vtysh: ["router bgp 65005", "neighbor 10.1.4.1 password ndrmd5test"]}
    revert:
      - {node: f1, vtysh: ["router bgp 65005", "no neighbor 10.1.4.1 password"]}
    probe:
      - {node: f1, vtysh1: "show bgp summary"}

  M14:
    scenario: S12
    title: f2 sends 2,000 prefixes instead of 200
    fresh: 0
    reapply: true
    edits:
      - file: configs/f2.conf
        from_file: overlays/M14/f2.conf
    apply:
      - {node: f2, vtysh_file: overlays/M14/add.conf}
    revert:
      - {node: f2, vtysh_file: overlays/M14/remove.conf}
    probe:
      - {node: f1, vtysh1: "show bgp summary"}
