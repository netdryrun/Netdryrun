# Interop L2 "iBGP / route reflector": SR Linux r1 reflects for clients cEOS c1, Junos c2 and FRR c3 (AS 65100, sessions
# on link addresses, static routes for reachability, no IGP). FRR e1 (AS 65200) peers eBGP with c1 and c3.
# Config idioms are copied from examples/junos-frr, srl-hidden-leak and arista-frr.
name: ndr-interop-l2

topology:
  nodes:
    r1:
      kind: nokia_srlinux
      image: ghcr.io/nokia/srlinux:26.7.2
      startup-config: configs/r1.cli
    c1:
      kind: arista_ceos
      image: ceos:4.36.3M
      startup-config: configs/c1.cfg
    c2:
      kind: juniper_cjunosevolved
      image: cjunosevolved:26.2R1.7-EVO
      startup-config: configs/c2.cfg
      env:
        CPTX_NUM_IF: "1"
    c3:
      kind: linux
      image: quay.io/frrouting/frr:10.4.1
      binds:
        - configs/daemons:/etc/frr/daemons
        - configs/vtysh.conf:/etc/frr/vtysh.conf
        - configs/c3.conf:/etc/frr/frr.conf
      exec:
        - ip route del default
    e1:
      kind: linux
      image: quay.io/frrouting/frr:10.4.1
      binds:
        - configs/daemons:/etc/frr/daemons
        - configs/vtysh.conf:/etc/frr/vtysh.conf
        - configs/e1.conf:/etc/frr/frr.conf
      exec:
        - ip route del default
  links:
    - endpoints: ["r1:e1-1", "c1:eth1"]
    - endpoints: ["r1:e1-2", "c2:eth4"]
    - endpoints: ["r1:e1-3", "c3:eth1"]
    - endpoints: ["c1:eth2", "e1:eth1"]
    - endpoints: ["c3:eth2", "e1:eth2"]
