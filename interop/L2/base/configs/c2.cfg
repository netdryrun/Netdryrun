system {
    host-name c2;
    login {
        user admin {
            uid 500;
            class superuser;
            authentication {
                encrypted-password "$6$9YSzwiCD$ZiMI1N.5fcWCe5fH8hZz/FtISY4K8QKjv9p0w6Hkyct71ke1bn3OQQk0oi7/l5Sn8yP1CClO9CeGSMpNQcFjT/"; ## SECRET-DATA
            }
        }
    }
    management-instance;
    services {
        netconf {
            ssh;
        }
        ssh {
            root-login allow;
        }
    }
}
interfaces {
    et-0/0/0 {
        unit 0 {
            family inet {
                address 10.2.2.2/30;
            }
        }
    }
    lo0 {
        unit 0 {
            family inet {
                address 10.100.0.3/32;
            }
        }
    }
    re0:mgmt-0 {
        unit 0 {
            family inet {
                address FXP0ADDR;
            }
        }
    }
}
policy-options {
    policy-statement EXPORT-OWN {
        term lo {
            from {
                route-filter 10.100.0.3/32 exact;
            }
            then {
                community add C2-STD;
                accept;
            }
        }
        term rest {
            then reject;
        }
    }
    policy-statement ACCEPT-ALL {
        then accept;
    }
    community C2-STD members 65100:3;
}
routing-options {
    router-id 10.100.0.3;
    autonomous-system 65100;
    static {
        route 10.2.0.0/16 next-hop 10.2.2.1;
    }
}
protocols {
    bgp {
        group rr {
            type internal;
            local-address 10.2.2.2;
            import ACCEPT-ALL;
            export EXPORT-OWN;
            neighbor 10.2.2.1;
        }
    }
}
