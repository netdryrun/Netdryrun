hostname c1
!
service routing protocols model multi-agent
!
interface Ethernet1
   no switchport
   ip address 10.2.1.2/30
!
interface Ethernet2
   no switchport
   ip address 10.3.1.2/30
!
interface Loopback0
   ip address 10.100.0.2/32
!
ip routing
!
ip route 10.2.0.0/16 10.2.1.1
!
route-map FROM-E1 permit 10
   set local-preference 200
   set community 65100:200 additive
!
route-map ACCEPT-ALL permit 10
!
router bgp 65100
   router-id 10.100.0.2
   neighbor 10.2.1.1 remote-as 65100
   neighbor 10.2.1.1 next-hop-self
   neighbor 10.2.1.1 send-community
   neighbor 10.3.1.1 remote-as 65200
   neighbor 10.3.1.1 send-community
   neighbor 10.3.1.1 route-map FROM-E1 in
   neighbor 10.3.1.1 route-map ACCEPT-ALL out
   network 10.100.0.2/32
!
end
