frr defaults datacenter
hostname c3
!
interface lo
 ip address 10.100.0.4/32
!
interface eth1
 ip address 10.2.3.2/30
!
interface eth2
 ip address 10.3.3.2/30
!
ip route 10.2.0.0/16 10.2.3.1
!
route-map FROM-E1 permit 10
 set local-preference 150
 set community 65100:150 additive
!
route-map ACCEPT-ALL permit 10
!
router bgp 65100
 bgp router-id 10.100.0.4
 neighbor 10.2.3.1 remote-as 65100
 neighbor 10.3.3.1 remote-as 65200
 address-family ipv4 unicast
  network 10.100.0.4/32
  neighbor 10.2.3.1 next-hop-self
  neighbor 10.2.3.1 route-map ACCEPT-ALL in
  neighbor 10.2.3.1 route-map ACCEPT-ALL out
  neighbor 10.3.3.1 route-map FROM-E1 in
  neighbor 10.3.3.1 route-map ACCEPT-ALL out
 exit-address-family
!
