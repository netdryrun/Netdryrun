frr defaults datacenter
hostname e1
!
interface lo
 ip address 198.51.100.1/24
 ip address 203.0.113.1/24
!
interface eth1
 ip address 10.3.1.1/30
!
interface eth2
 ip address 10.3.3.1/30
!
ip prefix-list P1 seq 10 permit 203.0.113.0/24
!
route-map TO-C1 permit 10
 set metric 50
 set community 65200:1
 set large-community 65200:0:1
!
route-map TO-C3 deny 5
 match ip address prefix-list P1
!
route-map TO-C3 permit 10
 set metric 70
 set community 65200:1
 set large-community 65200:0:1
 set as-path prepend 65200
!
route-map ACCEPT-ALL permit 10
!
router bgp 65200
 bgp router-id 10.200.0.1
 neighbor 10.3.1.2 remote-as 65100
 neighbor 10.3.1.2 sender-as-path-loop-detection
 neighbor 10.3.3.2 remote-as 65100
 neighbor 10.3.3.2 sender-as-path-loop-detection
 address-family ipv4 unicast
  network 198.51.100.0/24
  network 203.0.113.0/24
  neighbor 10.3.1.2 route-map ACCEPT-ALL in
  neighbor 10.3.1.2 route-map TO-C1 out
  neighbor 10.3.3.2 route-map ACCEPT-ALL in
  neighbor 10.3.3.2 route-map TO-C3 out
 exit-address-family
!
