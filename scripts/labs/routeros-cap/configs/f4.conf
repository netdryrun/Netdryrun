frr defaults datacenter
hostname f4
!
interface eth1
 ip address 192.0.2.6/30
!
route-map ACCEPT-ALL permit 10
!
route-map NOTHING deny 10
!
router bgp 65005
 bgp router-id 192.0.2.6
 neighbor 192.0.2.5 remote-as 65001
 address-family ipv4 unicast
  neighbor 192.0.2.5 route-map ACCEPT-ALL in
  neighbor 192.0.2.5 route-map NOTHING out
 exit-address-family
!
