frr defaults datacenter
hostname f1
!
interface lo
 ip address 10.20.0.1/24
!
interface eth1
 ip address 192.0.2.2/30
!
ip route 0.0.0.0/0 blackhole
ip route 10.21.0.0/24 blackhole
ip route 10.66.0.0/24 blackhole
!
ip prefix-list P20 seq 10 permit 10.20.0.0/24
!
route-map OUT permit 10
 match ip address prefix-list P20
 set metric 50
 set community 65002:100 65002:200
 set large-community 65002:1:1
route-map OUT permit 20
!
route-map ACCEPT-ALL permit 10
!
router bgp 65002
 bgp router-id 192.0.2.2
 neighbor 192.0.2.1 remote-as 65001
 address-family ipv4 unicast
  network 0.0.0.0/0
  network 10.20.0.0/24
  network 10.21.0.0/24
  network 10.66.0.0/24
  neighbor 192.0.2.1 route-map ACCEPT-ALL in
  neighbor 192.0.2.1 route-map OUT out
 exit-address-family
!
