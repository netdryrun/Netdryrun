frr defaults datacenter
hostname f2
!
interface eth1
 ip address 198.51.100.2/30
!
ip route 10.20.0.0/24 blackhole
!
route-map OUT permit 10
 set as-path prepend 65004 65004
!
route-map ACCEPT-ALL permit 10
!
router bgp 65004
 bgp router-id 198.51.100.2
 neighbor 198.51.100.1 remote-as 65001
 address-family ipv4 unicast
  network 10.20.0.0/24
  neighbor 198.51.100.1 route-map ACCEPT-ALL in
  neighbor 198.51.100.1 route-map OUT out
 exit-address-family
!
