frr defaults datacenter
hostname f3
!
interface eth1
 ip address 203.0.113.2/30
!
ip route 198.18.2.0/24 blackhole
!
route-map OUT permit 10
 set as-path prepend 65003 65003
!
route-map ACCEPT-ALL permit 10
!
router bgp 65003
 bgp router-id 203.0.113.2
 neighbor 203.0.113.1 remote-as 65001
 address-family ipv4 unicast
  network 198.18.2.0/24
  neighbor 203.0.113.1 route-map ACCEPT-ALL in
  neighbor 203.0.113.1 route-map OUT out
 exit-address-family
!
