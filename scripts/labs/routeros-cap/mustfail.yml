# Live must-fail coverage for the RouterOS driver (beta gate): every check type, on a live CHR, each violation a real
# state of this lab (see topology.clab.yml). Run with scripts/routeros_live_mustfail.py, which requires every
# "MUST FAIL" check to fail on usable device state (never on a node that didn't answer) and every "MUST PASS" control
# to pass. Not checkable on RouterOS (refused before deploying): IPv6, ping inside a VRF, med: 0.
lab: topology.clab.yml
timeout: 600   # the CHR VM boots, then the startup config is imported

checks:
  # ---- bgp_session
  - {name: "MUST PASS: session to f1 established", type: bgp_session, node: r1, neighbor: 192.0.2.2}
  - {name: "MUST PASS: session in VRF RED established", type: bgp_session, node: r1, neighbor: 203.0.113.2, vrf: RED}
  # (also tells the convergence gate that 192.0.2.99 is expected down, so negative checks don't wait for it)
  - {name: "MUST PASS: configured neighbor 192.0.2.99 is down", type: bgp_session, node: r1, neighbor: 192.0.2.99, state: down}
  - {name: "MUST FAIL: idle neighbor expected established", type: bgp_session, node: r1, neighbor: 192.0.2.99}
  - {name: "MUST FAIL: up session expected down", type: bgp_session, node: r1, neighbor: 192.0.2.2, state: down}

  # ---- bgp_prefixes (f1 sends 4, r1's inbound policy rejects 1: 3 accepted; f4 sends nothing)
  - {name: "MUST PASS: exactly 3 accepted", type: bgp_prefixes, node: r1, neighbor: 192.0.2.2, exact: 3}
  - {name: "MUST FAIL: over max", type: bgp_prefixes, node: r1, neighbor: 192.0.2.2, max: 2}
  - {name: "MUST FAIL: under min", type: bgp_prefixes, node: r1, neighbor: 192.0.2.2, min: 4}
  - {name: "MUST PASS: f4 sends nothing", type: bgp_prefixes, node: r1, neighbor: 192.0.2.6, exact: 0}
  - {name: "MUST FAIL: session up, zero prefixes", type: bgp_prefixes, node: r1, neighbor: 192.0.2.6, min: 1}

  # ---- route
  - {name: "MUST PASS: 10.20.0.0/24 via bgp", type: route, node: r1, prefix: 10.20.0.0/24, protocol: bgp}
  - {name: "MUST PASS: default via static", type: route, node: r1, prefix: 0.0.0.0/0, protocol: static}
  - {name: "MUST PASS: rejected prefix absent", type: route, node: r1, prefix: 10.66.0.0/24, present: false}
  - {name: "MUST PASS: VRF RED route via bgp", type: route, node: r1, prefix: 198.18.2.0/24, vrf: RED, protocol: bgp}
  - {name: "MUST FAIL: leaked default received but not installed", type: route, node: r1, prefix: 0.0.0.0/0, protocol: bgp, present: false}
  - {name: "MUST FAIL: rejected prefix expected present", type: route, node: r1, prefix: 10.66.0.0/24}
  - {name: "MUST FAIL: wrong protocol", type: route, node: r1, prefix: 10.20.0.0/24, protocol: static}

  # ---- bgp_route
  - {name: "MUST PASS: best path attributes", type: bgp_route, node: r1, prefix: 10.20.0.0/24, as_path: "65002",
     local_pref: 200, med: 50, next_hop: 192.0.2.2, communities: ["65002:100", "65002:1:1"], without_communities: [no-export]}
  - {name: "MUST PASS: prepended path in VRF RED", type: bgp_route, node: r1, prefix: 198.18.2.0/24, vrf: RED, as_path: "65003 65003 65003"}
  - {name: "MUST FAIL: leaked default in the BGP table", type: bgp_route, node: r1, prefix: 0.0.0.0/0, present: false}
  - {name: "MUST FAIL: wrong local-pref", type: bgp_route, node: r1, prefix: 10.20.0.0/24, local_pref: 100}
  - {name: "MUST FAIL: wrong MED", type: bgp_route, node: r1, prefix: 10.20.0.0/24, med: 60}
  - {name: "MUST FAIL: missing community", type: bgp_route, node: r1, prefix: 10.20.0.0/24, communities: ["65002:999"]}
  - {name: "MUST FAIL: forbidden large community", type: bgp_route, node: r1, prefix: 10.20.0.0/24, without_communities: ["65002:1:1"]}
  - {name: "MUST FAIL: wrong AS path in VRF RED", type: bgp_route, node: r1, prefix: 198.18.2.0/24, vrf: RED, as_path: "65003"}

  # ---- ping
  - {name: "MUST PASS: ping f1 from the loopback", type: ping, node: r1, target: 10.20.0.1, source: 10.10.10.1, count: 3}
  - {name: "MUST FAIL: blackholed target", type: ping, node: r1, target: 198.18.99.1, count: 2}
  - {name: "MUST FAIL: expected to fail but replies", type: ping, node: r1, target: 10.20.0.1, source: 10.10.10.1, count: 3, expect: failure}
