feature bgp
vrf context RED
vrf context EMPTY
interface Ethernet1/1
  no switchport
  ip address 10.0.1.1/30
  ipv6 address 2001:db8:1::1/64
  no shutdown
interface Ethernet1/2
  no switchport
  vrf member RED
  ip address 10.0.2.1/30
  no shutdown
interface loopback0
  ip address 192.168.10.1/32
ip route 0.0.0.0/0 Null0
ip prefix-list DENY66 seq 5 permit 192.168.66.0/24
ip prefix-list P20 seq 5 permit 192.168.20.0/24
route-map FROM-F1 deny 10
  match ip address prefix-list DENY66
route-map FROM-F1 permit 20
  match ip address prefix-list P20
  set local-preference 200
route-map FROM-F1 permit 30
route-map ALL permit 10
router bgp 65001
  router-id 192.168.10.1
  address-family ipv4 unicast
    network 192.168.10.1/32
  address-family ipv6 unicast
  neighbor 10.0.1.2
    remote-as 65002
    address-family ipv4 unicast
      route-map FROM-F1 in
      route-map ALL out
      send-community
      send-community extended
  neighbor 2001:db8:1::2
    remote-as 65002
    address-family ipv6 unicast
      route-map ALL in
      route-map ALL out
  neighbor 10.0.9.9
    remote-as 65009
    address-family ipv4 unicast
  vrf RED
    address-family ipv4 unicast
    neighbor 10.0.2.2
      remote-as 65003
      address-family ipv4 unicast
        route-map ALL in
        route-map ALL out
