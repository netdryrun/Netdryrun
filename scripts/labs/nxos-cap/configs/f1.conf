frr defaults traditional
hostname f1
ip route 192.168.20.0/24 blackhole
ip route 192.168.21.0/24 blackhole
ip route 192.168.66.0/24 blackhole
ipv6 route 2001:db8:20::/48 blackhole
route-map SET20 permit 10
 set community 65002:100 65002:200
 set large-community 65002:1:1
 set metric 50
!
router bgp 65002
 bgp router-id 10.0.1.2
 no bgp ebgp-requires-policy
 neighbor 10.0.1.1 remote-as 65001
 neighbor 2001:db8:1::1 remote-as 65001
 address-family ipv4 unicast
  network 192.168.20.0/24 route-map SET20
  network 192.168.21.0/24
  network 192.168.66.0/24
  neighbor 10.0.1.1 default-originate
  no neighbor 2001:db8:1::1 activate
 exit-address-family
 address-family ipv6 unicast
  network 2001:db8:20::/48
  neighbor 2001:db8:1::1 activate
 exit-address-family
